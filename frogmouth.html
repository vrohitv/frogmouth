<!doctype html>

<style>
/* ── tokens ──────────────────────────────────────────────────────
   Night is the default: frogmouths are nocturnal. The only accent is
   the amber of the bird's iris. Everything else is bark and lichen. */
:root, [data-theme="night"] {
  --bg: #2a2521;
  --panel: #312b26;
  --panel-2: #3b342e;
  --line: #4a423b;
  --text: #e8e0d2;
  --muted: #a89e90;
  --faint: #7d7469;
  --iris: #f0b43c;
  --iris-ink: #2b1d04;
  --iris-soft: rgba(240, 180, 60, .16);
  --moss: #a9b896;
  --danger: #e2675a;
  --grid: rgba(232, 224, 210, .085);
  --scrim: rgba(22, 18, 15, .6);
  --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 12px 32px -10px rgba(0, 0, 0, .6);
  /* the bird */
  --plume: #5e534a;
  --plume-2: #51473f;
  --plume-streak: #3d352f;
  --plume-light: #9a8b79;
  --horn: #a59578;
  --branch: #3f352d;
  --lid: #6b5e52;
  --word-stroke: #2a2521;
  color-scheme: dark;
}
[data-theme="day"] {
  --bg: #e9e5de;
  --panel: #dfdad2;
  --panel-2: #d3cdc3;
  --line: #c2b9ab;
  --text: #2b2520;
  --muted: #6b6257;
  --faint: #978d80;
  --iris: #b8770e;
  --iris-ink: #fffaf0;
  --iris-soft: rgba(184, 119, 14, .14);
  --moss: #5f7350;
  --danger: #b9402f;
  --grid: rgba(43, 37, 32, .11);
  --scrim: rgba(60, 52, 44, .35);
  --shadow: 0 1px 0 rgba(60, 50, 40, .12), 0 12px 28px -12px rgba(60, 50, 40, .35);
  --plume: #8c7d6e;
  --plume-2: #7d6f61;
  --plume-streak: #5f5347;
  --plume-light: #b9aa96;
  --horn: #b8a888;
  --branch: #6a5a4b;
  --lid: #8c7d6e;
  --word-stroke: #e9e5de;
  color-scheme: light;
}
:root {
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --side-w: 232px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--iris); outline-offset: 1px; }
::selection { background: var(--iris-soft); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); }
.grow { flex: 1; }
kbd {
  font: 500 10.5px/1 var(--mono);
  padding: 2px 4px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 3px;
  color: var(--muted);
  background: var(--bg);
  white-space: nowrap;
}
.ic { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ── buttons & fields ── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  height: 30px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 5px;
  background: var(--panel-2); cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--iris); color: var(--iris-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary kbd { background: transparent; color: inherit; border-color: currentColor; opacity: .7; }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--panel-2); }
.btn.danger { color: var(--danger); }
.btn.primary.danger { background: var(--danger); color: #fff; }
.btn.small { height: 26px; padding: 0 8px; font-size: 12px; }
.btn.big { height: 42px; padding: 0 18px; font-size: 15px; }
.btn:disabled { opacity: .6; cursor: default; }
.icon-btn {
  display: inline-grid; place-items: center; width: 24px; height: 24px;
  border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; padding: 0;
}
.icon-btn:hover { background: var(--panel-2); color: var(--text); }
.field {
  width: 100%; height: 32px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: 5px;
  background: var(--bg); color: var(--text); font: inherit; outline: none;
}
textarea.field { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.45; }
.field:focus { border-color: var(--iris); }
.field.bad { border-color: var(--danger); }
.field.mono { font-family: var(--mono); font-size: 12.5px; }
.masked { -webkit-text-security: disc; }
.stack { display: grid; gap: 10px; }

/* ── the bird ── */
.fm { display: block; overflow: visible; cursor: pointer; }
.fm text { font-weight: 800; fill: var(--text); letter-spacing: -.01em; user-select: none; }
.fm-big text, .fm-face text { stroke: var(--word-stroke); stroke-width: 6px; stroke-linejoin: round; paint-order: stroke; }
.fm-iris { fill: #e19a26; }
.fm-iris-in { fill: #f5c55a; opacity: .75; }
.fm-ring { fill: none; stroke: #3a2810; stroke-width: 2.5; }
.fm-pup { fill: #15100a; }
.fm-glint { fill: #fff6df; }
.fm-pupil { transition: transform .14s ease-out; }
.fm-lid { fill: var(--lid); }
.fm-lid-edge { stroke: #2d241d; stroke-width: 2.5; stroke-linecap: round; }
.fm-lidg { transition: transform .26s cubic-bezier(.3, .7, .3, 1); }
.fm-lidg.fast { transition-duration: .08s; }
.fm-head { transform-box: view-box; transform-origin: 0 40px; transition: transform .5s cubic-bezier(.2, .8, .3, 1); }
.fm-skull { fill: var(--plume); }
.fm-body { fill: var(--plume-2); }
.fm-wing { fill: var(--plume); opacity: .55; }
.fm-beak-top { fill: var(--plume-light); opacity: .45; }
.fm-streak { fill: none; stroke: var(--plume-streak); stroke-width: 3.5; stroke-linecap: round; }
.fm-brow path { fill: none; stroke: var(--plume-light); stroke-width: 3.5; stroke-linecap: round; }
.fm-mini-brow { fill: none; stroke: var(--muted); stroke-width: 7; stroke-linecap: round; }
.fm-beak { fill: var(--horn); }
.fm-gape { fill: none; stroke: var(--plume-streak); stroke-width: 3; stroke-linecap: round; }
.fm-bristle { fill: none; stroke: var(--plume-light); stroke-width: 2.5; stroke-linecap: round; }
.fm-branch { fill: none; stroke: var(--branch); stroke-width: 18; stroke-linecap: round; }
.fm-twig { fill: none; stroke: var(--branch); stroke-width: 7; stroke-linecap: round; }
.fm-feet { fill: none; stroke: var(--horn); stroke-width: 4; stroke-linecap: round; }
.fm.ruffle .fm-head { animation: ruffle .5s cubic-bezier(.3, .6, .4, 1); }
@keyframes ruffle {
  0% { transform: scale(1); }
  30% { transform: scale(1.04, .97) rotate(-2deg); }
  60% { transform: scale(.99, 1.02) rotate(1.5deg); }
  100% { transform: scale(1); }
}

/* ── welcome ── */
.welcome {
  position: fixed; inset: 0; overflow: auto;
  display: grid; place-items: center; padding: 24px 16px;
}
.w-inner { width: min(560px, 100%); display: grid; justify-items: center; gap: 18px; }
.w-bird { width: min(480px, 92vw); }
.w-bird .fm { width: 100%; height: auto; }
.w-card { width: 100%; display: grid; gap: 14px; justify-items: center; text-align: center; }
.w-lead { font-size: 16px; margin: 0; max-width: 40ch; color: var(--text); }
.w-actions { display: grid; gap: 14px; justify-items: center; width: 100%; }
.w-recents { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
.w-recents .muted { margin-right: 4px; }
.recent span { max-width: 22ch; overflow: hidden; text-overflow: ellipsis; }
.w-alt { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.w-fine { color: var(--faint); font-size: 12px; max-width: 52ch; margin: 6px 0 0; }
.w-row { display: flex; gap: 8px; width: min(360px, 100%); }
.w-pass { height: 38px; font-size: 15px; }
.w-err { color: var(--danger); min-height: 1.2em; margin: 0; font-size: 12.5px; }
.shake { animation: shake .36s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

/* ── shell ── */
.shell { position: fixed; inset: 0; display: grid; grid-template-rows: 44px 1fr 24px; }
.top { display: flex; align-items: stretch; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { width: var(--side-w); flex: none; display: flex; align-items: center; padding: 0 14px; border-right: 1px solid var(--line); }
.brand .fm { height: 36px; width: auto; }
.brand .fm-face text { stroke: var(--panel); }
.shell.no-side .brand { width: auto; }
.tabs { display: flex; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 7px; padding: 0 8px 0 12px;
  border-right: 1px solid var(--line); color: var(--muted); cursor: pointer;
  white-space: nowrap; user-select: none; position: relative; max-width: 220px;
}
.tab:hover { color: var(--text); }
.tab.on { background: var(--bg); color: var(--text); }
.tab.on::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--iris); }
.tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--bg); }
.tab-name { overflow: hidden; text-overflow: ellipsis; }
.tab-x { display: grid; place-items: center; width: 20px; height: 20px; border: 0; background: none; border-radius: 4px; color: inherit; opacity: 0; cursor: pointer; padding: 0; }
.tab-x .ic { width: 12px; height: 12px; }
.tab:hover .tab-x, .tab.on .tab-x { opacity: .7; }
.tab-x:hover { opacity: 1; background: var(--panel-2); }
.top-btn { border: 0; background: none; color: var(--muted); width: 36px; cursor: pointer; display: grid; place-items: center; }
.top-btn:hover { color: var(--text); }
.top-search {
  margin: 6px 10px 6px auto; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px;
  border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--muted); cursor: pointer; min-width: 180px; flex: none;
}
.top-search span { flex: 1; text-align: left; }
.top-search:hover { color: var(--text); border-color: var(--faint); }

.main { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: 0; }
.shell.no-side .main { grid-template-columns: 0 1fr; }
.shell.no-side .side { visibility: hidden; }
.view { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.view-empty, .board-empty {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--text); pointer-events: none;
}
.view-empty p, .board-empty p { margin: 3px 0; }

/* ── explorer ── */
.side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; padding-bottom: 8px; }
.side-sec { padding: 10px 0 4px; }
.side-h { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 4px 14px; font-weight: 600; color: var(--muted); font-size: 12px; }
.side-item {
  display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px 0 14px; cursor: pointer; color: var(--text);
  border-left: 2px solid transparent; outline-offset: -2px;
}
.side-item .ic { color: var(--muted); }
.side-item:hover { background: var(--panel-2); }
.side-item.on { background: var(--panel-2); border-left-color: var(--iris); }
.si-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.si-n { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.si-act { display: none; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px; border-radius: 3px; }
.si-act:hover { color: var(--text); background: var(--line); }
.side-item:hover .si-act { display: grid; }
.side-item:hover .si-n { display: none; }
.side-tags { padding: 6px 0 0; }
.tag-row { padding: 0; }
.tag-k, .tag-v {
  display: flex; align-items: center; gap: 7px; width: 100%; border: 0; background: none; cursor: pointer;
  height: 24px; padding: 0 10px 0 30px; color: var(--muted); text-align: left; font-size: 12.5px;
}
.tag-k .ic { width: 13px; height: 13px; }
.tag-k span, .tag-v span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag-v { padding-left: 52px; }
.tag-k i, .tag-v i { font-style: normal; color: var(--faint); font-size: 11px; }
.tag-k:hover, .tag-v:hover { background: var(--panel-2); color: var(--text); }
.side-foot { margin-top: auto; display: flex; gap: 4px; padding: 10px 8px 0; flex-wrap: wrap; }

/* ── status bar ── */
.status { display: flex; align-items: center; background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); padding: 0 6px; min-width: 0; overflow: hidden; }
.st-item { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border: 0; background: none; color: inherit; white-space: nowrap; }
button.st-item { cursor: pointer; }
button.st-item:hover { background: var(--panel-2); color: var(--text); }
.st-item .ic { width: 13px; height: 13px; }
.st-vault { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; flex: none; }
.st-ok .dot { background: var(--moss); }
.st-pending .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--iris); }
.st-busy .dot { background: var(--iris); animation: pulse .8s infinite alternate; }
.st-bad { color: var(--danger); }
.st-bad .dot { background: var(--danger); }
.st-mem .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
@keyframes pulse { to { opacity: .3; } }

/* ── board ── */
.board-vp {
  position: absolute; inset: 0; overflow: hidden; cursor: default; touch-action: none;
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--grid) 1.1px, transparent 1.3px);
}
.board-vp.far { background-image: none; }
.board-vp.grab, .board-vp.grab * { cursor: grab !important; }
.board-vp.panning, .board-vp.panning * { cursor: grabbing !important; }
.board-vp.drop { box-shadow: inset 0 0 0 2px var(--iris); }
.plane { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.plane.glide { transition: transform .36s cubic-bezier(.2, .8, .3, 1); }
.plane.arranging .note { transition: transform .4s cubic-bezier(.2, .8, .3, 1); }

/* paper colours */
.paper-straw { --paper: #ead598; --ink: #2d2416; --rule: rgba(45, 36, 22, .12); }
.paper-lichen { --paper: #bfcca8; --ink: #222a1b; --rule: rgba(34, 42, 27, .12); }
.paper-dusk { --paper: #b4c4d5; --ink: #1c2633; --rule: rgba(28, 38, 51, .12); }
.paper-moth { --paper: #ddd5c8; --ink: #2b2620; --rule: rgba(43, 38, 32, .12); }
.paper-rose { --paper: #e7bcae; --ink: #34201b; --rule: rgba(52, 32, 27, .12); }
.paper-night { --paper: #463e37; --ink: #ece4d6; --rule: rgba(236, 228, 214, .14); }

.note {
  position: absolute; left: 0; top: 0;
  display: flex; flex-direction: column;
  background: var(--paper); color: var(--ink);
  border-radius: 2px 2px 3px 3px;
  box-shadow: 0 1px 1px rgba(0, 0, 0, .22), 0 14px 26px -16px rgba(0, 0, 0, .7);
  min-height: 72px;
}
.note.sel { outline-offset: 2px; }
.note.editing { box-shadow: 0 1px 1px rgba(0, 0, 0, .22), 0 20px 40px -18px rgba(0, 0, 0, .8); }
.note.dragging { box-shadow: 0 2px 2px rgba(0, 0, 0, .2), 0 26px 50px -18px rgba(0, 0, 0, .8); cursor: grabbing; }
.note.flash { animation: flash 1.1s ease-out; }
@keyframes flash { 0%, 35% { outline: 4px solid var(--iris); outline-offset: 4px; } 100% { outline-offset: 2px; } }
.note-grip {
  height: 18px; flex: none; cursor: grab; display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding: 0 4px 0 8px;
  background-image: radial-gradient(circle, var(--rule) 1px, transparent 1.2px); background-size: 5px 5px; background-position: center; background-repeat: repeat-x;
  border-radius: 2px 2px 0 0;
}
.note-swatches { display: flex; gap: 3px; opacity: 0; transition: opacity .12s; margin-right: auto; }
.note:hover .note-swatches, .note.sel .note-swatches { opacity: 1; }
.sw { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .3); background: var(--paper); cursor: pointer; padding: 0; }
.note-x { display: grid; place-items: center; width: 16px; height: 16px; padding: 0; border: 0; background: none; color: var(--ink); opacity: 0; cursor: pointer; border-radius: 3px; }
.note-x .ic { width: 11px; height: 11px; }
.note:hover .note-x, .note.sel .note-x { opacity: .5; }
.note-x:hover { opacity: 1 !important; background: var(--rule); }
.note-body {
  flex: 1; min-height: 0; overflow: auto; padding: 0 14px 10px; outline: none;
  font: 13.5px/1.5 var(--sans); cursor: text; overflow-wrap: anywhere;
  scrollbar-width: thin;
}
.note-body.drop { box-shadow: inset 0 0 0 2px var(--iris); }
.note-body > :first-child { margin-top: 2px; }
.note-body > p:first-child { font-weight: 700; font-size: 15px; line-height: 1.35; margin-bottom: 6px; }
.note-body p { margin: 0 0 4px; }
.note-body h1 { font-size: 19px; line-height: 1.25; margin: 8px 0 6px; }
.note-body h2 { font-size: 16px; line-height: 1.3; margin: 8px 0 4px; }
.note-body h3 { font-size: 14px; margin: 6px 0 3px; }
.note-body h1:first-child, .note-body h2:first-child, .note-body h3:first-child { margin-top: 2px; }
.note-body ul, .note-body ol { margin: 2px 0 6px; padding-left: 20px; }
.note-body li { margin: 1px 0; }
.note-body blockquote { margin: 4px 0 6px; padding: 0 0 0 10px; border-left: 3px solid var(--rule); opacity: .85; }
.note-body hr { border: 0; border-top: 1px solid var(--rule); margin: 10px 0; }
.note-body a[href] { color: inherit; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 2px; text-decoration-thickness: 2px; }
.note-body a[href]:hover { text-decoration-color: currentColor; }
.note-body :not(pre) > code { font: .88em var(--mono); background: var(--rule); padding: 1px 4px; border-radius: 3px; }
.note-body mark { background: var(--iris-soft); color: inherit; }
.note-body b, .note-body strong { font-weight: 700; }

/* todo lists */
.note-body ul[data-type="todo"] { list-style: none; padding-left: 0; }
.note-body ul[data-type="todo"] li { position: relative; padding-left: 22px; }
.note-body ul[data-type="todo"] li::before {
  content: ""; position: absolute; left: 2px; top: .32em; width: 12px; height: 12px;
  border: 1.5px solid currentColor; border-radius: 3px; opacity: .6; cursor: pointer;
}
.note-body ul[data-type="todo"] li[data-checked="true"]::before { background: currentColor; opacity: .75; }
.note-body ul[data-type="todo"] li[data-checked="true"]::after {
  content: ""; position: absolute; left: 6.5px; top: calc(.32em + 2.5px); width: 3px; height: 6px;
  border: solid var(--paper); border-width: 0 2px 2px 0; transform: rotate(45deg); pointer-events: none;
}
.note-body ul[data-type="todo"] li[data-checked="true"] { text-decoration: line-through; text-decoration-color: var(--rule); opacity: .6; }

/* chips: note links, file tags, secret refs */
.note-body .mention, .note-body .fref, .note-body .sref {
  display: inline-flex; align-items: center; gap: 3px; vertical-align: baseline;
  padding: 0 5px; border-radius: 3px; background: var(--rule); color: inherit;

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = h('textarea', { style: { position: 'fixed', opacity: '0' } });
    ta.value = text; document.body.append(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }
}

function download(name, text, type = 'application/json') {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ── minimal IndexedDB key/value (for remembering folder handles) ─ */
const idb = (() => {
  let p;
  const db = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('frogmouth', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => db().then((d) => new Promise((res, rej) => {
    const tx = d.transaction('kv', mode);
    const req = fn(tx.objectStore('kv'));
    tx.oncomplete = () => res(req && req.result);
    tx.onerror = () => rej(tx.error);
  }));
  return {
    get: (k) => run('readonly', (s) => s.get(k)).catch(() => undefined),
    set: (k, v) => run('readwrite', (s) => s.put(v, k)).catch(() => undefined),
  };
})();

const ls = {
  get(k, d) { try { const v = localStorage.getItem('fm:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('fm:' + k, JSON.stringify(v)); } catch {} },
};

/* ── 01-bird.js ── */
/* ── the frogmouth (the bird) ────────────────────────────────────────────────
   The wordmark "frogmouth" where both o's are the bird's amber eyes.
   Eyes follow the pointer (or the text caret while typing), blink,
   squint when idle (frogmouths camouflage by narrowing their eyes) and
   shut tight while a secret or passphrase is being typed. */
const Bird = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const FONT = 'ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif';
  const eyes = new Set();
  const heads = new Set();
  const LID = { wide: 0.0, rest: 0.2, squint: 0.6, sleepy: 0.84, closed: 1.06 };
  let px = innerWidth / 2, py = innerHeight / 3, focusPt = null, focusT = 0;
  let mood = 'rest', lastAct = now(), raf = 0, clipN = 0, blinking = false;

  const s = (tag, attrs = {}, kids = []) => {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    kids.forEach((k) => el.append(k));
    return el;
  };

  let ctx;
  function measure(text, size) {
    ctx = ctx || document.createElement('canvas').getContext('2d');
    ctx.font = `800 ${size}px ${FONT}`;
    return ctx.measureText(text).width;
  }

  function eye(cx, cy, r, svg) {
    const id = 'fmeye' + ++clipN;
    const pupil = s('g', { class: 'fm-pupil' }, [
      s('circle', { r: r * 0.47, class: 'fm-pup' }),
      s('circle', { r: r * 0.15, cx: -r * 0.17, cy: -r * 0.2, class: 'fm-glint' }),
    ]);
    const lid = s('path', {
      class: 'fm-lid',
      d: `M${-r * 1.3} ${-r * 2.6}H${r * 1.3}V0Q0 ${r * 0.42} ${-r * 1.3} 0Z`,
    });
    const lidEdge = s('path', { class: 'fm-lid-edge', d: `M${-r * 1.3} 0Q0 ${r * 0.42} ${r * 1.3} 0`, fill: 'none' });
    const lidG = s('g', { class: 'fm-lidg' }, [lid, lidEdge]);
    const ring = s('circle', { r, class: 'fm-ring' });
    const g = s('g', { class: 'fm-eye', transform: `translate(${cx} ${cy})` }, [
      s('clipPath', { id }, [s('circle', { r: r - 0.5 })]),
      s('circle', { r, class: 'fm-iris' }),
      s('circle', { r: r * 0.78, class: 'fm-iris-in' }),
      s('g', { 'clip-path': `url(#${id})` }, [pupil, lidG]),
      ring,
    ]);
    const e = { g, pupil, lid: lidG, ring, r, svg };
    eyes.add(e);
    setLid(e, LID.closed);
    return e;
  }

  function setLid(e, amt) {
    e.lid.style.transform = `translateY(${((-1.42 + amt * 2.42) * e.r).toFixed(2)}px)`;
  }

  /* Build an SVG. kind = 'big' (welcome: whole bird on a branch)
     | 'face' (header: head, brows and beak around the wordmark) | 'mini' (wordmark only). */
  function make(kind = 'mini') {
    const big = kind === 'big', face = big || kind === 'face';
    const R = big ? 27 : 26; // eye radius
    const E = 100; // eye centre x offset from 0
    const pad = big ? 12 : 9;
    const gmW = measure('gm', 100);
    const fs = (2 * (E - R - pad)) / gmW * 100;
    const frW = measure('fr', fs), uthW = measure('uth', fs);
    const base = fs * 0.27; // baseline so the x-height centres on the eyes
    const leftX = -E - R - pad, rightX = E + R + pad;

    const svg = s('svg', { class: 'fm fm-' + kind, role: 'img', 'aria-label': 'frogmouth' });
    const head = s('g', { class: 'fm-head' });
    const word = s('g', { class: 'fm-word' });
    const txt = (t, x, anchor) => {
      const el = s('text', { x, y: base, 'text-anchor': anchor, 'font-size': fs.toFixed(1), 'font-family': FONT });
      el.textContent = t;
      return el;
    };

    if (big) {
      const plume = s('g', { class: 'fm-plume' });
      // branch it is perched on (behind the bird)
      plume.append(s('path', { class: 'fm-branch', d: 'M-310 352 C-170 328 90 344 310 312' }));
      plume.append(s('path', { class: 'fm-twig', d: 'M186 326 C214 298 244 290 276 292M-214 342 C-236 362 -256 372 -290 376' }));
      // long tail hanging below the branch, like a broken-off stick
      plume.append(s('path', { class: 'fm-body', d: 'M-34 330 L-26 446 Q0 458 26 446 L34 330Z' }));
      plume.append(s('path', { class: 'fm-streak', d: 'M-8 360 L-6 440M10 356 L9 436' }));
      // upright, tapering body: frogmouths pose as dead branches
      plume.append(s('path', { class: 'fm-body', d: 'M-150 60 C-170 150 -128 262 -60 338 Q0 362 60 338 C128 262 170 150 150 60Z' }));
      // shoulders/wings folded at the sides
      plume.append(s('path', { class: 'fm-wing', d: 'M-150 70 C-176 170 -140 270 -84 330 C-120 250 -128 160 -112 96Z' }));
      plume.append(s('path', { class: 'fm-wing', d: 'M150 70 C176 170 140 270 84 330 C120 250 128 160 112 96Z' }));
      // bark-like streaks down the breast
      const streaks = [[-78, 150, -86, 230], [-48, 166, -54, 276], [-16, 150, -12, 300], [16, 170, 20, 296], [48, 160, 54, 270], [80, 150, 88, 226], [-34, 240, -30, 330], [32, 236, 28, 326], [0, 260, 2, 340]];
      streaks.forEach(([x1, y1, x2, y2]) => plume.append(s('path', { class: 'fm-streak', d: `M${x1} ${y1} Q${(x1 + x2) / 2 + 4} ${(y1 + y2) / 2} ${x2} ${y2}` })));
      // feet gripping the branch
      plume.append(s('path', { class: 'fm-feet', d: 'M-38 340 l-9 14 M-30 342 l0 15 M-22 342 l7 13 M22 342 l-7 13 M30 342 l0 15 M38 340 l9 14' }));
      svg.append(plume);
    }
    if (face && !big) {
      // compact head for the header: same bird, flatter so the letters stay readable
      head.append(s('path', { class: 'fm-skull', d: 'M-176 8 C-180 -38 -116 -62 -36 -64 Q0 -65 36 -64 C116 -62 180 -38 176 8 C170 52 112 86 0 92 C-112 86 -170 52 -176 8Z' }));
      const brow = (sx) => {
        const g = s('g', { class: 'fm-brow' });
        [[30, -34, 90, -58, 156, -48], [44, -38, 104, -66, 172, -64], [18, -30, 70, -46, 128, -30]].forEach(([a, b, c, d, e, f]) =>
          g.append(s('path', { d: `M${sx * a} ${b} Q${sx * c} ${d} ${sx * e} ${f}` })));
        return g;
      };
      head.append(brow(-1), brow(1));
      head.append(s('path', { class: 'fm-beak', d: 'M-92 46 Q0 28 92 46 Q70 72 22 84 Q8 90 0 98 Q-8 90 -22 84 Q-70 72 -92 46Z' }));
      head.append(s('path', { class: 'fm-gape', d: 'M-92 46 Q-46 68 0 72 Q46 68 92 46' }));
    } else if (face) {
      // very broad, flat head
      head.append(s('path', { class: 'fm-skull', d: 'M-192 18 C-198 -48 -128 -92 -40 -96 Q0 -98 40 -96 C128 -92 198 -48 192 18 C186 74 132 116 0 126 C-132 116 -186 74 -192 18Z' }));
      // mottled crown
      head.append(s('path', { class: 'fm-streak', d: 'M-60 -80 q4 16 0 30M-30 -86 q4 18 0 34M0 -88 q4 18 0 36M30 -86 q4 18 0 34M60 -80 q4 16 0 30' }));
      // bristly tufts flaring over the eyes
      const brow = (sx) => {
        const g = s('g', { class: 'fm-brow' });
        [[34, -38, 96, -70, 170, -62], [46, -44, 110, -86, 186, -92], [58, -50, 116, -100, 158, -126], [22, -32, 74, -54, 140, -36]].forEach(([a, b, c, d, e, f]) =>
          g.append(s('path', { d: `M${sx * a} ${b} Q${sx * c} ${d} ${sx * e} ${f}` })));
        return g;
      };
      head.append(brow(-1), brow(1));
      // the enormous frog-wide beak the bird is named for, hooked at the tip
      head.append(s('path', { class: 'fm-beak', d: 'M-118 54 Q0 30 118 54 Q96 92 30 112 Q12 120 0 132 Q-12 120 -30 112 Q-96 92 -118 54Z' }));
      head.append(s('path', { class: 'fm-beak-top', d: 'M-60 50 Q0 40 60 50 Q30 70 0 76 Q-30 70 -60 50Z' }));
      head.append(s('path', { class: 'fm-gape', d: 'M-118 54 Q-60 86 0 92 Q60 86 118 54' }));
      head.append(s('path', { class: 'fm-bristle', d: 'M-22 48 l-8 -12 M-8 46 l-3 -14 M8 46 l3 -14 M22 48 l8 -12' }));
    } else {
      // little brow strokes so the mini mark still reads as a face
      head.append(s('path', { class: 'fm-mini-brow', d: `M${-E - R * 1.15} ${-R * 1.25} Q${-E} ${-R * 1.75} ${-E + R * 1.1} ${-R * 1.15}` }));
      head.append(s('path', { class: 'fm-mini-brow', d: `M${E - R * 1.1} ${-R * 1.15} Q${E} ${-R * 1.75} ${E + R * 1.15} ${-R * 1.25}` }));
    }

    word.append(txt('fr', leftX, 'end'), txt('gm', 0, 'middle'), txt('uth', rightX, 'start'));
    head.append(word);
    const e1 = eye(-E, 0, R, svg), e2 = eye(E, 0, R, svg);
    head.append(e1.g, e2.g);
    svg.append(head);

    const minX = Math.min(leftX - frW, big ? -310 : face ? -180 : 1e9) - 6;
    const maxX = Math.max(rightX + uthW, big ? 310 : face ? 180 : -1e9) + 6;
    const minY = big ? -132 : face ? -70 : -R * 1.9;
    const maxY = big ? 462 : face ? 100 : base + fs * 0.26;
    svg.setAttribute('viewBox', `${minX.toFixed(1)} ${minY.toFixed(1)} ${(maxX - minX).toFixed(1)} ${(maxY - minY).toFixed(1)}`);

    if (face) heads.add({ svg, head });
    svg.addEventListener('click', () => startle(svg));
    // wake up: eyes open with a slow blink, once.
    setTimeout(() => { setLid(e1, lidAmt()); setLid(e2, lidAmt()); }, big ? 650 : 250);
    schedule();
    return svg;
  }

  const isShy = () => { const a = document.activeElement; return !!(a && a.closest && a.closest('[data-shy]')); };
  function lidAmt() { return isShy() ? LID.closed : LID[mood]; }
  function applyLids() { for (const e of eyes) setLid(e, lidAmt()); }

  function setMood(m) {
    if (mood === m) return;
    mood = m;
    if (!blinking) applyLids();
  }

  function blink(twice) {
    if (isShy() || blinking || mood === 'sleepy') return;
    blinking = true;
    for (const e of eyes) { e.lid.classList.add('fast'); setLid(e, LID.closed); }
    setTimeout(() => {
      applyLids();
      setTimeout(() => {
        for (const e of eyes) e.lid.classList.remove('fast');
        blinking = false;
        if (twice) setTimeout(() => blink(false), 140);
      }, 120);
    }, 110);
  }

  function startle(svg) {
    activity();
    svg.classList.remove('ruffle'); void svg.getBoundingClientRect(); svg.classList.add('ruffle');
    setMood('wide');
    clearTimeout(startle.t);
    startle.t = setTimeout(() => setMood('rest'), 900);
  }

  function activity() {
    lastAct = now();
    if (mood === 'squint' || mood === 'sleepy') { setMood('rest'); blink(true); }
  }

  function schedule() { if (!raf) raf = requestAnimationFrame(frame); }

  function frame() {
    raf = 0;
    const useFocus = focusPt && now() - focusT < 2500;
    const tx = useFocus ? focusPt.x : px, ty = useFocus ? focusPt.y : py;
    for (const e of eyes) {
      if (!e.svg.isConnected) { eyes.delete(e); continue; }
      const b = e.ring.getBoundingClientRect();
      if (!b.width) continue;
      const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
      const dx = tx - cx, dy = ty - cy, d = Math.hypot(dx, dy) || 1;
      const k = Math.min(1, d / (b.width * 2.5));
      const off = e.r * 0.4 * k;
      e.pupil.style.transform = `translate(${((dx / d) * off).toFixed(2)}px,${((dy / d) * off).toFixed(2)}px)`;
    }
    for (const hd of heads) {
      if (!hd.svg.isConnected) { heads.delete(hd); continue; }
      const b = hd.svg.getBoundingClientRect();
      if (!b.width) continue;
      const dx = tx - (b.left + b.width / 2);
      hd.head.style.transform = `rotate(${clamp(dx / 90, -5, 5).toFixed(2)}deg)`;
    }
  }

  addEventListener('pointermove', (e) => { px = e.clientX; py = e.clientY; focusPt = null; activity(); schedule(); }, { passive: true });
  addEventListener('keydown', () => activity(), true);
  document.addEventListener('pointerleave', () => { px = innerWidth / 2; py = innerHeight / 2; schedule(); });

  // shut eyes while secrets are being typed
  const reshy = () => setTimeout(() => { if (!blinking) applyLids(); }, 0);
  document.addEventListener('focusin', reshy);
  document.addEventListener('focusout', reshy);

  // idle → squint → sleepy; random blinks while awake
  setInterval(() => {
    const idle = now() - lastAct;
    if (idle > 120000) setMood('sleepy');
    else if (idle > 30000) setMood('squint');
  }, 2000);
  (function loop() {
    setTimeout(() => { if (!document.hidden) blink(Math.random() < 0.18); loop(); }, 2600 + Math.random() * 4800);
  })();

  return {
    make,
    blink,
    look(x, y) { focusPt = { x, y }; focusT = now(); schedule(); },
    mood: setMood,
    activity,
  };
})();

/* ── 02-crypto.js ── */
/* ── optional vault encryption (AES-256-GCM, PBKDF2-SHA256) ───── */
const Vcrypt = (() => {
  const ITER = 600000;
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = (buf) => {
    const a = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000));
    return btoa(s);
  };
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  async function derive(pass, salt, iterations) {
    const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }

  return {
    available: () => !!(window.crypto && crypto.subtle),
    /* create a fresh key for a new passphrase */
    async create(pass) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      return { key: await derive(pass, salt, ITER), salt, iterations: ITER };
    },
    async seal(c, plaintext) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, c.key, te.encode(plaintext));
      return {
        frogmouth: 1,
        encrypted: true,
        kdf: { name: 'PBKDF2', hash: 'SHA-256', iterations: c.iterations, salt: b64(c.salt) },
        cipher: { name: 'AES-GCM', iv: b64(iv) },
        data: b64(ct),
      };
    },
    /* throws on a wrong passphrase */
    async open(pass, env) {
      const salt = unb64(env.kdf.salt);
      const c = { key: await derive(pass, salt, env.kdf.iterations), salt, iterations: env.kdf.iterations };
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.cipher.iv) }, c.key, unb64(env.data));
      return { c, text: td.decode(pt) };
    },
    /* decrypt with an already-derived key (same salt), e.g. after a disk reload */
    async openWithKey(c, env) {
      if (env.kdf.salt !== b64(c.salt)) throw new Error('locked');
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.cipher.iv) }, c.key, unb64(env.data));
      return { c, text: td.decode(pt) };
    },
  };
})();

/* ── 03-store.js ── */
/* ── store: state, the .frogmouth file, sync, images ───────────────
   A vault is a folder. Inside it lives one `*.frogmouth` file (JSON,
   optionally encrypted) plus any images, which notes reference by path
   relative to the folder. Writes are debounced and atomic
   (createWritable swaps the file on close). */
const Store = (() => {
  const FILE = 'vault.frogmouth';
  const IMG_RE = /\.(png|jpe?g|gif|webp|svg|avif|bmp|ico)$/i;
  const S = {
    data: null,
    vault: null, // {kind:'dir'|'opfs'|'memory', dir, fh, name, file}
    crypt: null,
    dirty: false, saving: false, again: false,
    lastMod: 0,
    status: 'idle', statusText: '',
    notes: new Map(), // id -> {note, board}
    rev: 0,
    imgCache: new Map(),
  };

  const canPickDir = () => typeof window.showDirectoryPicker === 'function';
  const canOPFS = () => !!(navigator.storage && navigator.storage.getDirectory);

  /* ── data shape ── */
  function blankData() {
    const b = { id: uid(), name: 'Inbox', created: now(), notes: [] };
    const n1 = uid(), n2 = uid(), n3 = uid();

/* ── Popup: one floating, keyboard-driven list used for /, @, pickers ─ */
const Popup = (() => {
  let el = null, items = [], idx = 0, opts = null;

  function render() {
    const list = el.querySelector('.pop-list');
    if (!items.length) {
      list.innerHTML = `<div class="pop-empty">${esc(opts.empty || 'No matches')}</div>`;
      return;
    }
    list.innerHTML = items.map((it, i) =>
      `<div class="pop-item${i === idx ? ' on' : ''}" data-i="${i}">` +
      (it.icon ? `<span class="pop-ic">${it.icon.startsWith('<') ? it.icon : icon(it.icon)}</span>` : '') +
      `<span class="pop-label">${it.labelHtml || esc(it.label)}</span>` +
      (it.hint ? `<span class="pop-hint">${esc(it.hint)}</span>` : '') + '</div>').join('');
    const on = list.children[idx];
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  }

  function place(x, y) {
    const r = el.getBoundingClientRect();
    let left = clamp(x, 8, innerWidth - r.width - 8);
    let top = y + 6;
    if (top + r.height > innerHeight - 8) top = Math.max(8, (opts.above != null ? opts.above : y) - r.height - 6);
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  }

  function open(o) {
    close();
    opts = o; items = o.items || []; idx = 0;
    el = h('div', { class: 'pop', role: 'listbox' },
      o.title ? h('div', { class: 'pop-title', text: o.title }) : null,
      o.input ? h('input', { class: 'pop-input', placeholder: o.placeholder || 'Filter', spellcheck: 'false' }) : null,
      h('div', { class: 'pop-list' }));
    el.addEventListener('mousedown', (e) => {
      if (e.target.closest('.pop-input')) return;
      e.preventDefault();
      const it = e.target.closest('.pop-item');
      if (it) pick(+it.dataset.i);
    });
    el.addEventListener('mousemove', (e) => {
      const it = e.target.closest('.pop-item');
      if (it && +it.dataset.i !== idx) { idx = +it.dataset.i; render(); }
    });
    document.body.append(el);
    render();
    place(o.x, o.y);
    if (o.input) {
      const inp = el.querySelector('.pop-input');
      inp.addEventListener('input', () => o.onQuery && o.onQuery(inp.value));
      inp.addEventListener('keydown', (e) => { if (key(e)) { e.preventDefault(); e.stopPropagation(); } });
      inp.focus();
    }
  }

  function update(list) {
    if (!el) return;
    items = list; idx = Math.min(idx, Math.max(0, items.length - 1));
    if (idx < 0) idx = 0;
    render();
  }

  function pick(i) {
    const it = items[i];
    const o = opts;
    close(true);
    if (it && o && o.onPick) o.onPick(it);
  }

  function close(picked) {
    if (!el) return;
    el.remove(); el = null;
    const o = opts; opts = null;
    if (o && o.onClose) o.onClose(!!picked);
  }

  /* returns true when the key was consumed */
  function key(e) {
    if (!el) return false;
    if (e.key === 'ArrowDown' || (e.ctrlKey && e.key === 'n')) { idx = (idx + 1) % Math.max(1, items.length); render(); return true; }
    if (e.key === 'ArrowUp' || (e.ctrlKey && e.key === 'p')) { idx = (idx - 1 + items.length) % Math.max(1, items.length); render(); return true; }
    if (e.key === 'Enter' || e.key === 'Tab') { if (items.length) { pick(idx); return true; } close(); return e.key === 'Tab'; }
    if (e.key === 'Escape') { close(); return true; }
    return false;
  }

  addEventListener('mousedown', (e) => { if (el && !el.contains(e.target)) close(); }, true);
  addEventListener('resize', () => close());
  return { open, update, close, key, isOpen: () => !!el };
})();

/* ── Modal dialogs (never native alert/confirm/prompt) ─────────── */
const Modal = (() => {
  let stack = [];
  function open({ title, body, actions = [], wide, onClose, cls }) {
    return new Promise((resolve) => {
      const prevFocus = document.activeElement;
      const card = h('div', { class: 'modal' + (wide ? ' wide' : '') + (cls ? ' ' + cls : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
      const scrim = h('div', { class: 'scrim' }, card);
      const done = (v) => {
        scrim.remove();
        stack = stack.filter((m) => m !== scrim);
        if (onClose) onClose(v);
        if (prevFocus && prevFocus.focus && prevFocus.isConnected) prevFocus.focus({ preventScroll: true });
        resolve(v);
      };
      scrim.addEventListener('mousedown', (e) => { if (e.target === scrim) done(null); });
      card.append(h('h2', { text: title }));
      if (body) card.append(typeof body === 'function' ? body(done) : body);
      if (actions.length) {
        card.append(h('div', { class: 'modal-actions' }, actions.map((a) =>
          h('button', { class: 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : ''), text: a.label, onclick: async () => {
            const v = a.value !== undefined ? a.value : a.run ? await a.run() : true;
            if (v !== false) done(v);
          } }))));
      }
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); done(null); }
        if (e.key === 'Enter' && (modKey(e) || (e.target.tagName === 'INPUT'))) {
          const p = actions.find((a) => a.primary);
          if (p) { e.preventDefault(); card.querySelector('.btn.primary').click(); }
        }
      });
      document.body.append(scrim);
      stack.push(scrim);
      const f = card.querySelector('input,textarea,select,.btn.primary');
      if (f) f.focus();
    });
  }

  const confirm = (title, text, label = 'Delete', danger = true) =>
    open({ title, body: h('p', { class: 'muted', text }), actions: [{ label: 'Cancel', value: false }, { label, primary: true, danger, value: true }] }).then(Boolean);

  function prompt(title, value = '', { placeholder = '', label = 'Save', shy = false, type = 'text', hint } = {}) {
    const inp = h('input', { class: 'field', value, placeholder, type, spellcheck: 'false', autocomplete: 'off' });
    if (shy) inp.setAttribute('data-shy', '');
    return open({ title, body: h('div', null, inp, hint ? h('p', { class: 'muted small', text: hint }) : null),
      actions: [{ label: 'Cancel', value: null }, { label, primary: true, run: () => inp.value }] });
  }

  return { open, confirm, prompt, isOpen: () => stack.length > 0 };
})();

    const img = h('img', { alt: '', draggable: 'false' });
    const ui = h('div', { class: 'pic-ui' },
      h('button', { 'data-z': 'out', title: 'Zoom out', text: '−' }),
      h('button', { 'data-z': 'fit', title: 'Fit (double-click image)', class: 'pic-pct', text: '100%' }),
      h('button', { 'data-z': 'in', title: 'Zoom in', text: '+' }));
    const grip = h('div', { class: 'pic-grip', title: 'Drag to resize. Double-click for natural height.' });
    fig.replaceChildren(img, ui, grip);
    const st = { s: 1, x: 0, y: 0, fit: 1, nw: 0, nh: 0 };
    picState.set(fig, st);
    const src = fig.getAttribute('data-src');
    const set = (u) => { if (u) img.src = u; else { fig.classList.add('missing'); fig.title = 'Image not found: ' + src; } };
    if (src.startsWith('data:')) set(src); else Store.resolveImage(src).then(set);
    img.onload = () => { st.nw = img.naturalWidth; st.nh = img.naturalHeight; sizePic(fig); fitPic(fig); };
  }
  function sizePic(fig) {
    const st = picState.get(fig); if (!st || !st.nw) return;
    const w = fig.clientWidth || 240;
    const want = +fig.getAttribute('data-h') || Math.min(360, Math.round(st.nh * (w / st.nw)));
    fig.style.height = Math.max(60, want) + 'px';
  }
  function fitPic(fig) {
    const st = picState.get(fig); if (!st || !st.nw) return;
    const w = fig.clientWidth, hh = fig.clientHeight;
    st.fit = Math.min(w / st.nw, hh / st.nh);
    st.s = st.fit;
    st.x = (w - st.nw * st.s) / 2; st.y = (hh - st.nh * st.s) / 2;
    applyPic(fig);
  }
  function applyPic(fig) {
    const st = picState.get(fig);
    const img = fig.querySelector('img');
    img.style.width = st.nw + 'px'; img.style.height = st.nh + 'px';
    img.style.transform = `translate(${st.x}px,${st.y}px) scale(${st.s})`;
    fig.querySelector('.pic-pct').textContent = Math.round(st.s * 100) + '%';
    fig.classList.toggle('zoomed', st.s > st.fit * 1.01);
  }
  function zoomPic(fig, f, lx, ly) {
    const st = picState.get(fig); if (!st || !st.nw) return;
    if (lx == null) { lx = fig.clientWidth / 2; ly = fig.clientHeight / 2; }
    const ns = clamp(st.s * f, Math.min(st.fit, 0.05), 16);
    st.x = lx - (lx - st.x) * (ns / st.s);
    st.y = ly - (ly - st.y) * (ns / st.s);
    st.s = ns;
    applyPic(fig);
  }
  const boardZ = () => (typeof Board !== 'undefined' ? Board.zoom() : 1);
  function local(fig, e) {
    const r = fig.getBoundingClientRect(), z = boardZ();
    return [(e.clientX - r.left) / z, (e.clientY - r.top) / z];
  }
  // global listeners so pictures in any note work
  document.addEventListener('wheel', (e) => {
    const fig = e.target.closest && e.target.closest('figure.pic');
    if (!fig || e.target.closest('.pic-ui')) return;
    e.preventDefault(); e.stopPropagation();
    const [lx, ly] = local(fig, e);
    const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    zoomPic(fig, Math.exp(-d * (e.ctrlKey ? 0.01 : 0.0025)), lx, ly);
  }, { passive: false, capture: true });
  document.addEventListener('pointerdown', (e) => {
    const fig = e.target.closest && e.target.closest('figure.pic');
    if (!fig || e.button !== 0) return;
    const btn = e.target.closest('.pic-ui button');
    if (btn) {
      e.preventDefault(); e.stopPropagation();
      const z = btn.dataset.z;
      if (z === 'in') zoomPic(fig, 1.25); else if (z === 'out') zoomPic(fig, 0.8); else fitPic(fig);
      return;
    }
    e.preventDefault(); e.stopPropagation();
    const st = picState.get(fig); if (!st) return;
    const sx = e.clientX, sy = e.clientY, z = boardZ();
    if (e.target.classList.contains('pic-grip')) {
      const h0 = fig.clientHeight;
      const mv = (ev) => { fig.style.height = clamp(h0 + (ev.clientY - sy) / z, 60, 3000) + 'px'; };
      const up = () => {
        removeEventListener('pointermove', mv); removeEventListener('pointerup', up);
        fig.setAttribute('data-h', Math.round(fig.clientHeight)); fitPic(fig);
        fig.dispatchEvent(new Event('input', { bubbles: true }));
      };
      addEventListener('pointermove', mv); addEventListener('pointerup', up);
      return;
    }
    const ox = st.x, oy = st.y;
    fig.classList.add('panning');
    const mv = (ev) => { st.x = ox + (ev.clientX - sx) / z; st.y = oy + (ev.clientY - sy) / z; applyPic(fig); };
    const up = () => { fig.classList.remove('panning'); removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up);
  }, true);
  document.addEventListener('dblclick', (e) => {
    const fig = e.target.closest && e.target.closest('figure.pic');
    if (!fig) return;
    e.preventDefault(); e.stopPropagation();
    if (e.target.classList.contains('pic-grip')) {
      fig.removeAttribute('data-h'); sizePic(fig); fitPic(fig);
      fig.dispatchEvent(new Event('input', { bubbles: true }));
    } else fitPic(fig);
  }, true);

  /* ── refresh chips after load / when titles change ───────────── */
  function hydrate(body) {
    for (const p of body.querySelectorAll('pre.code')) { const c = ensureCode(p); paint(c, c.textContent, null); ensureAfter(p); }
    for (const f of body.querySelectorAll('figure.pic')) hydratePic(f);
    refreshChips(body);
    if (!body.firstChild) body.append(h('p', null, h('br')));
  }
  function refreshChips(body) {
    for (const a of body.querySelectorAll('a.mention')) {
      const ref = Store.noteRef(a.dataset.note);
      const t = ref ? '@' + (ref.note.title || 'Untitled') : a.textContent.replace(/^@?/, '@');
      if (a.textContent !== t) a.textContent = t;
      a.classList.toggle('missing', !ref);
      a.title = ref ? `${ref.board.name} — click to open` : 'Note was deleted';
    }
    for (const s of body.querySelectorAll('span.sref')) {
      const x = Store.secret(s.dataset.secret);
      if (x && s.textContent !== x.key) s.textContent = x.key;
      s.classList.toggle('missing', !x);
      s.title = x ? 'Click to copy the value' : 'Secret was deleted';
    }
    for (const s of body.querySelectorAll('span.fref')) {
      const p = s.dataset.path;
      if (!s.textContent) s.textContent = p.split('/').pop();
      s.title = p + ' — click for options';
    }
  }

  /* ── triggers: / commands and @ tags ─────────────────────────── */
  let trig = null; // {kind, node, off, body, ctx}
  const SLASH = [
    { id: 'p', label: 'Text', hint: 'plain paragraph', icon: 'note', k: 'text paragraph p' },
    { id: 'h1', label: 'Heading 1', hint: '#', icon: 'cmd', k: 'h1 heading title' },
    { id: 'h2', label: 'Heading 2', hint: '##', icon: 'cmd', k: 'h2 heading subtitle' },
    { id: 'h3', label: 'Heading 3', hint: '###', icon: 'cmd', k: 'h3 heading' },
    { id: 'ul', label: 'Bullet list', hint: '-', icon: 'cmd', k: 'bullet list ul unordered' },
    { id: 'ol', label: 'Numbered list', hint: '1.', icon: 'cmd', k: 'numbered list ol ordered' },
    { id: 'todo', label: 'Todo list', hint: '[]', icon: 'cmd', k: 'todo checkbox task check' },
    { id: 'code', label: 'Code block', hint: '``` lang', icon: 'cmd', k: 'code block snippet pre' },
    { id: 'quote', label: 'Quote', hint: '>', icon: 'cmd', k: 'quote blockquote' },
    { id: 'hr', label: 'Divider', hint: '---', icon: 'cmd', k: 'divider hr line rule' },
    { id: 'image', label: 'Image', hint: 'from vault or computer', icon: 'image', k: 'image picture png screenshot upload' },
    { id: 'file', label: 'File tag', hint: 'any file in the vault', icon: 'folder', k: 'file attach excalidraw pdf tag' },
    { id: 'mention', label: 'Link a note', hint: '@', icon: 'note', k: 'mention link note reference @' },
    { id: 'secret', label: 'Secret reference', hint: 'copies on click', icon: 'key', k: 'secret key env password token' },
    { id: 'link', label: 'Web link', hint: 'url', icon: 'link', k: 'link url href web' },
    { id: 'date', label: 'Today’s date', hint: '', icon: 'cmd', k: 'date today time now' },
  ];

  function slashItems(q) {
    q = q.toLowerCase();
    const [cmd] = q.split(' ');
    const out = [];
    for (const it of SLASH) {
      const m = fuzzy(cmd, (it.label + ' ' + it.k).toLowerCase());
      if (m) out.push({ ...it, sc: m.s + (it.label.toLowerCase().startsWith(cmd) ? 50 : 0) });
    }
    return cmd ? out.sort((a, b) => b.sc - a.sc) : SLASH.slice();
  }

  let filesCache = { at: 0, list: [] };
  async function vaultFiles() {
    if (now() - filesCache.at < 8000) return filesCache.list;
    filesCache = { at: now(), list: await Store.listFiles() };
    return filesCache.list;
  }
  bus.on('loaded', () => { filesCache = { at: 0, list: [] }; });

  function mentionItems(q, selfId) {
    q = q.toLowerCase().trim();
    const out = [];
    for (const [id, { note, board }] of Store.S.notes) {
      if (id === selfId) continue;
      const t = note.title || 'Untitled';
      const m = fuzzy(q, t.toLowerCase());
      if (m) out.push({ kind: 'note', id, label: t, labelHtml: markPositions(t, m.p), hint: board.name, icon: 'note', sc: m.s + (note.updated || 0) / 1e13 });
    }
    for (const p of filesCache.list) {
      const m = fuzzy(q, p.toLowerCase());
      if (m && (q || out.length < 12)) out.push({ kind: 'file', path: p, label: p, labelHtml: markPositions(p, m.p), hint: 'file', icon: /\.(png|jpe?g|gif|webp|svg|avif)$/i.test(p) ? 'image' : 'folder', sc: m.s - 5 });
    }
    out.sort((a, b) => b.sc - a.sc);
    return out.slice(0, 40);
  }

  function startTrigger(kind, body, ctx) {
    const r = rng(); if (!r || r.startContainer.nodeType !== 3) return;
    const node = r.startContainer, off = r.startOffset - 1;
    if (node.data[off] !== kind) return;
    const prevCh = node.data[off - 1];
    if (prevCh && !/[\s ([{]/.test(prevCh)) return;
    const t = (trig = { kind, node, off, body, ctx });
    const rect = caretRect();
    if (kind === '@') vaultFiles().then(() => trig && trig.kind === '@' && Popup.update(mentionItems(query(), ctx.note.id)));
    Popup.open({
      x: rect.left, y: rect.bottom, above: rect.top,
      items: kind === '/' ? slashItems('') : mentionItems('', ctx.note.id),
      empty: kind === '/' ? 'No command' : 'No notes or files match',
      onPick: (it) => { trig = t; applyTrigger(it); },
      onClose: () => { if (trig === t) trig = null; },
    });
  }
  function query() {
    const r = rng();
    if (!trig || !r || r.startContainer !== trig.node || r.startOffset <= trig.off) return null;
    return trig.node.data.slice(trig.off + 1, r.startOffset).replace(/\u00a0/g, ' ');
  }
  function updateTrigger() {
    if (!trig) return;
    const q = query();
    if (q == null || q.length > 48 || /\n/.test(q) || (trig.kind === '/' && /\s\s/.test(q)) || (trig.kind === '@' && /\s{2}/.test(q))) { Popup.close(); return; }
    const items = trig.kind === '/' ? slashItems(q) : mentionItems(q, trig.ctx.note.id);
    if (!items.length && /\s$/.test(q)) { Popup.close(); return; }
    Popup.update(items);
  }
  function eatTrigger() {
    const r = rng();
    if (!trig) return '';
    const q = query() || '';
    selectBetween(trig.node, trig.off, trig.node, trig.off + 1 + q.length);
    exec('delete');
    return q;
  }
  function applyTrigger(it) {
    const t = trig; if (!t) return;
    const q = eatTrigger();
    trig = null;
    if (t.kind === '@') return insertRef(it);
    const arg = q.split(' ').slice(1).join(' ').trim();
    command(it.id, t.body, t.ctx, arg);
  }

  /* chips and images go in through the Range API: Chrome's insertHTML
     misplaces contenteditable=false nodes at the end of a block */
  function bodyOf(node) { const e = node && (node.nodeType === 1 ? node : node.parentNode); return e && e.closest('.note-body'); }
  function insertInline(el) {
    const r = rng(); if (!r) return;
    const body = bodyOf(r.startContainer); if (!body) return;
    r.deleteContents();
    const sp = document.createTextNode('\u00a0');
    r.insertNode(sp); r.insertNode(el);
    const nr = document.createRange(); nr.setStart(sp, 1); nr.collapse(true);
    const s = getSelection(); s.removeAllRanges(); s.addRange(nr);
    refreshChips(body); commitSoon(body);
  }
  function insertBlock(el) {
    const r = rng();
    const body = r && bodyOf(r.startContainer); if (!body) return;
    let top = r.startContainer;
    while (top && top.parentNode !== body) top = top.parentNode;
    if (top && top.nodeType === 1 && top.tagName === 'P' && !top.textContent.trim() && !top.querySelector('figure,a,span,img')) top.replaceWith(el);
    else if (top) top.after(el); else body.append(el);
    let next = el.nextElementSibling;
    if (!next || next.tagName !== 'P') { next = h('p', null, h('br')); el.after(next); }
    placeCaret(next, false);
    if (el.matches('figure.pic')) hydratePic(el);
    commitSoon(body);
  }
  function insertRef(it) {
    if (it.kind === 'note') insertInline(h('a', { class: 'mention', contenteditable: 'false', 'data-note': it.id }, '@' + it.label));
    else if (it.kind === 'file') {
      if (/\.(png|jpe?g|gif|webp|svg|avif|bmp)$/i.test(it.path) && it.asImage) insertPic(it.path);
      else insertInline(h('span', { class: 'fref', contenteditable: 'false', 'data-path': it.path }, it.path.split('/').pop()));
    } else if (it.kind === 'secret') insertInline(h('span', { class: 'sref', contenteditable: 'false', 'data-secret': it.id }, it.label));
  }
  function insertPic(src) { insertBlock(h('figure', { class: 'pic', contenteditable: 'false', 'data-src': src })); }

  /* Chrome sometimes nests lists/blocks inside <p>; flatten, keeping the caret */
  const NESTED = ':scope > :is(p,h1,h2,h3) > :is(ul,ol,pre,blockquote,p,h1,h2,h3,figure,hr)';
  const BLOCKY = /^(UL|OL|PRE|BLOCKQUOTE|P|H1|H2|H3|FIGURE|HR)$/;
  function fixNesting(body) {
    if (!body.querySelector(NESTED)) return;
    const r = rng();
    const had = r && body.contains(r.startContainer);
    const [a, b] = had ? getOff(body) : [0, 0];
    for (const child of body.querySelectorAll(NESTED)) {
      const parent = child.parentNode;
      if (!parent || parent === body || !parent.parentNode) continue;
      const out = [];
      let run = null;
      for (const n of Array.from(parent.childNodes)) {
        if (n.nodeType === 1 && BLOCKY.test(n.tagName)) { run = null; out.push(n); }
        else { if (!run) { run = document.createElement(parent.tagName); out.push(run); } run.append(n); }
      }
      parent.replaceWith(...out.filter((n) => !(n.tagName === parent.tagName && !BLOCKY.test(n.firstChild && n.firstChild.nodeName) && !n.textContent.replace(/[\s\u200b]/g, '') && !n.querySelector('br,a,span,code'))));
    }
    if (had) setOff(body, a, b);
  }

  /* ── block commands ──────────────────────────────────────────── */
  function command(id, body, ctx, arg = '') {
    body.focus();
    const r = rng();
    const block = r && lineBlock(r.startContainer, body);
    switch (id) {
      case 'p': exec('formatBlock', 'p'); break;
      case 'h1': case 'h2': case 'h3': exec('formatBlock', id); break;
      case 'quote': exec('formatBlock', 'blockquote'); break;
      case 'ul': if (!block || !block.closest('ul')) exec('insertUnorderedList'); break;
      case 'ol': if (!block || !block.closest('ol')) exec('insertOrderedList'); break;
      case 'todo': {
        if (!block || !block.closest('ul')) exec('insertUnorderedList');
        const r2 = rng();
        const ul = r2 && lineBlock(r2.startContainer, body) && lineBlock(r2.startContainer, body).closest('ul');
        if (ul) { ul.setAttribute('data-type', 'todo'); for (const li of ul.children) if (!li.hasAttribute('data-checked')) li.setAttribute('data-checked', arg === 'x' ? 'true' : 'false'); }
        break;
      }
      case 'code': {
        const b = block && block !== body && block.tagName !== 'LI' ? block : null;
        const pre = h('pre', { class: 'code' });
        if (arg) pre.setAttribute('data-lang', arg.toLowerCase());
        const code = h('code', null, (b && b.tagName !== 'PRE' ? b.textContent : '') + '\n');
        pre.append(code);
        if (b && b.tagName !== 'PRE') b.replaceWith(pre); else if (b) b.after(pre); else body.append(pre);
        ensureAfter(pre);
        paint(code, code.textContent, Math.max(0, code.textContent.length - 1));
        snap(code, true);
        break;
      }
      case 'hr': {
        const p = h('p', null, h('br'));
        const hr = h('hr');
        if (block && block.parentNode === body) {
          if (!block.textContent.trim()) block.replaceWith(hr); else block.after(hr);
        } else body.append(hr);
        hr.after(p); placeCaret(p, false);
        break;
      }
      case 'date': exec('insertText', new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })); break;
      case 'mention': exec('insertText', '@'); startTrigger('@', body, ctx); break;
      case 'link': linkCmd(); break;
      case 'image': pickImage(); break;
      case 'file': pickFile(); break;
      case 'secret': pickSecret(); break;
    }
    fixNesting(body);
    commitSoon(body);
  }

  async function linkCmd() {
    const r = rng(); const saved = r && r.cloneRange();
    const text = saved ? saved.toString() : '';
    const url = await Modal.prompt('Link to', /^https?:/.test(text) ? text : 'https://', { label: 'Insert link' });
    if (!url || !/^(https?:|mailto:)/i.test(url)) return;
    const s = getSelection(); s.removeAllRanges(); if (saved) s.addRange(saved);
    if (text) exec('createLink', url);
    else exec('insertHTML', `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>&nbsp;`);
  }

  /* picker that remembers where the caret was */
  function pickWith(title, load, onPick, extra) {
    const r = rng(); const saved = r && r.cloneRange();
    const rect = caretRect() || { left: innerWidth / 2 - 150, bottom: 120, top: 120 };
    let all = [];
    const restore = () => { const s = getSelection(); s.removeAllRanges(); if (saved) s.addRange(saved); };
    const filter = (q) => {
      q = (q || '').toLowerCase();
      const out = [];
      for (const it of all) { const m = fuzzy(q, it.label.toLowerCase()); if (m) out.push({ ...it, labelHtml: markPositions(it.label, m.p), sc: m.s }); }
      if (q) out.sort((a, b) => b.sc - a.sc);
      return (extra ? [extra] : []).concat(out.slice(0, 200));
    };
    Popup.open({
      x: rect.left, y: rect.bottom, above: rect.top, title, input: true, placeholder: 'Type to filter',
      items: extra ? [extra] : [], empty: 'Nothing here yet',
      onQuery: (q) => Popup.update(filter(q)),
      onPick: (it) => { restore(); onPick(it); },
      onClose: (picked) => { if (!picked) restore(); },
    });
    Promise.resolve(load()).then((list) => { all = list; Popup.update(filter('')); });
  }

  function pickImage() {
    const up = { kind: 'upload', label: 'Upload from computer…', icon: 'plus', hint: Store.hasFolder() ? 'copied into assets/' : 'embedded' };
    pickWith('Insert image', async () => (await Store.listImages()).map((p) => ({ kind: 'file', path: p, label: p, icon: 'image', asImage: true })),
      (it) => {
        if (it.kind === 'upload') return chooseFiles('image/*', async (files) => { for (const f of files) await addImage(f); });
        insertPic(it.path);
      }, up);
  }
  function pickFile() {
    const up = Store.hasFolder() ? { kind: 'upload', label: 'Add a file from computer…', icon: 'plus', hint: 'copied into files/' } : null;
    pickWith('Tag a file', async () => (await Store.listFiles()).map((p) => ({ kind: 'file', path: p, label: p, icon: 'folder' })),
      (it) => {
        if (it.kind === 'upload') return chooseFiles('', async (files) => { for (const f of files) await addFile(f); });
        insertRef(it);
      }, up);
    if (!Store.hasFolder()) toast('Open a vault folder to tag files');
  }
  function pickSecret() {
    pickWith('Reference a secret', () => Store.S.data.secrets.map((x) => ({ kind: 'secret', id: x.id, label: x.key, icon: 'key', hint: x.tags.join(' ') })), insertRef);
  }
  function chooseFiles(accept, cb) {
    const r = rng(); const saved = r && r.cloneRange();
    const inp = h('input', { type: 'file', multiple: true, accept, style: { display: 'none' } });
    inp.onchange = async () => {
      const s = getSelection(); s.removeAllRanges(); if (saved) s.addRange(saved);
      await cb(Array.from(inp.files)); inp.remove();
    };
    document.body.append(inp); inp.click();
  }
  async function addImage(file) {
    const res = await Store.saveImage(file, file.name);
    insertPic(res.path || res.dataUrl);
  }
  async function addFile(file) {
    if (file.type.startsWith('image/')) return addImage(file);
    const path = await Store.importFile(file);
    if (path) { filesCache.at = 0; insertRef({ kind: 'file', path }); }
    else toast('Open a vault folder to attach files', { kind: 'warn' });
  }

  /* file tag actions */
  async function fileMenu(chip) {
    const path = chip.dataset.path;
    const r = chip.getBoundingClientRect();
    const f = await Store.fileAt(path);
    if (!f) { toast(`${path} isn't in the vault folder`, { kind: 'warn' }); chip.classList.add('missing'); return; }
    chip.classList.remove('missing');
    const kb = f.size < 1024 * 1024 ? Math.max(1, Math.round(f.size / 1024)) + ' KB' : (f.size / 1048576).toFixed(1) + ' MB';
    Popup.open({
      x: r.left, y: r.bottom, title: `${path}  ${kb}`,
      items: [
        { id: 'open', label: 'Open in a new tab', icon: 'eye' },
        { id: 'save', label: 'Save a copy…', icon: 'down' },
        { id: 'copy', label: 'Copy path', icon: 'copy' },
      ],
      onPick: async (it) => {
        if (it.id === 'copy') { await copyText(path); toast('Copied ' + path); return; }
        const type = /\.(excalidraw|json)$/i.test(path) ? 'application/json' : f.type || 'text/plain';
        const url = URL.createObjectURL(new Blob([f], { type: it.id === 'open' && /^(text\/|application\/json)/.test(type) ? 'text/plain;charset=utf-8' : type }));
        if (it.id === 'open') window.open(url, '_blank', 'noopener');
        else { const a = h('a', { href: url, download: f.name }); document.body.append(a); a.click(); a.remove(); }
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      },
    });
  }

  /* ── markdown-ish shortcuts on space ─────────────────────────── */
  function autoFormat(body, ctx) {
