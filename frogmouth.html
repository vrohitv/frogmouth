    const body = e.target.closest && e.target.closest('.note-body');
    if (body && !e.ctrlKey && !e.metaKey) {
      const canY = body.scrollHeight > body.clientHeight + 1;
      if (canY && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        const atTop = body.scrollTop <= 0, atBot = body.scrollTop + body.clientHeight >= body.scrollHeight - 1;
        if ((e.deltaY < 0 && !atTop) || (e.deltaY > 0 && !atBot)) return;
      }
    }
    const pre = e.target.closest && e.target.closest('pre.code');
    if (pre && !e.ctrlKey && Math.abs(e.deltaX) > Math.abs(e.deltaY) && pre.scrollWidth > pre.clientWidth) return;
    e.preventDefault();
    const k = e.deltaMode === 1 ? 16 : 1;
    if (e.ctrlKey || e.metaKey) {
      const r = vp.getBoundingClientRect();
      zoomAt(view.z * Math.exp(-e.deltaY * k * 0.01), e.clientX - r.left, e.clientY - r.top);
    } else {
      view.x -= (e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX) * k;
      view.y -= (e.shiftKey && !e.deltaX ? 0 : e.deltaY) * k;
      applyView();
    }
  }

  function zoomAt(z, cx, cy) {
    z = clamp(z, 0.2, 2.5);
    if (cx == null) { cx = vp.clientWidth / 2; cy = vp.clientHeight / 2; }
    view.x = cx - (cx - view.x) * (z / view.z);
    view.y = cy - (cy - view.y) * (z / view.z);
    view.z = z;
    applyView();
  }

  function animateView() {
    plane.classList.add('glide');
    clearTimeout(animateView.t);
    animateView.t = setTimeout(() => plane.classList.remove('glide'), 380);
  }

  function fit() {
    if (!board || !board.notes.length) { view = { x: 40, y: 40, z: 1 }; animateView(); applyView(); return; }
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const n of board.notes) {
      const el = els.get(n.id); const hh = el ? el.offsetHeight : 200;
      x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y); x2 = Math.max(x2, n.x + n.w); y2 = Math.max(y2, n.y + hh);
    }
    const pad = 60, W = vp.clientWidth, H = vp.clientHeight;
    const z = clamp(Math.min((W - pad * 2) / (x2 - x1), (H - pad * 2) / (y2 - y1)), 0.2, 1);
    view = { z, x: (W - (x2 - x1) * z) / 2 - x1 * z, y: (H - (y2 - y1) * z) / 2 - y1 * z };
    animateView(); applyView();
  }

  /* ── selection & keyboard ── */
  function select(id) {
    if (sel === id) return;
    if (sel && els.get(sel)) els.get(sel).classList.remove('sel');
    sel = id;
    if (id && els.get(id)) els.get(id).classList.add('sel');
  }
  function bringFront(n) {
    if ((n.z || 1) >= maxZ && board.notes.filter((m) => m.z === n.z).length === 1) return;
    n.z = ++maxZ;
    place(n);
    Store.change('z');
  }

  function focusBody(id, end = true) {
    const el = els.get(id); if (!el) return;
    const body = el.querySelector('.note-body');
    body.contentEditable = 'true';
    el.classList.add('editing');
    select(id);
    body.focus({ preventScroll: true });
    const r = document.createRange();
    const last = body.lastElementChild && body.lastElementChild.tagName === 'FIGURE' ? body : (body.lastElementChild || body);
    r.selectNodeContents(last); r.collapse(!end);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  /* enter edit mode with the caret where the user double-clicked */
  function editAt(id, x, y) {
    const el = els.get(id); if (!el) return;
    const body = el.querySelector('.note-body');
    body.contentEditable = 'true';
    el.classList.add('editing');
    select(id);
    body.focus({ preventScroll: true });
    const r = document.caretRangeFromPoint ? document.caretRangeFromPoint(x, y) : null;
    if (r && body.contains(r.startContainer)) { const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    else focusBody(id);
  }

  function center(id, flash = true) {
    const ref = Store.noteRef(id); const el = els.get(id);
    if (!ref || !el) return;
    const n = ref.note;
    const z = Math.max(view.z, 0.8);
    view = { z, x: vp.clientWidth / 2 - (n.x + n.w / 2) * z, y: Math.min(vp.clientHeight / 3, vp.clientHeight / 2 - (el.offsetHeight / 2) * z) - n.y * z };
    animateView(); applyView();
    select(id); bringFront(n);
    if (flash) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  }

  function key(e) {
    if (!board) return false;
    const k = e.key;
    const n = sel && Store.noteRef(sel) && Store.noteRef(sel).note;
    if ((k === 'n' || k === 'N') && !modKey(e) && !e.altKey) { addNote(null, true); return true; }
    if (k === '=' || k === '+') { zoomAt(view.z * 1.2); return true; }
    if (k === '-' || k === '_') { zoomAt(view.z / 1.2); return true; }
    if (k === '0' && !modKey(e)) { zoomAt(1); return true; }
    if (k === '!' || (k === '1' && e.shiftKey)) { fit(); return true; }
    if (k === 'Tab') { cycle(e.shiftKey ? -1 : 1); return true; }
    if (!n) {
      const pan = { ArrowLeft: [80, 0], ArrowRight: [-80, 0], ArrowUp: [0, 80], ArrowDown: [0, -80] }[k];
      if (pan) { view.x += pan[0]; view.y += pan[1]; applyView(); return true; }
      return false;
    }
    if (k === 'Enter') { focusBody(n.id); return true; }
    if (k === 'Escape') { select(null); return true; }
    if (k === 'Delete' || k === 'Backspace') { remove(n.id); return true; }
    if (/^[1-6]$/.test(k) && !modKey(e)) { setColor(n, COLORS[+k - 1]); return true; }
    if (modKey(e) && k.toLowerCase() === 'd') { duplicate(n); return true; }
    const d = e.shiftKey ? GRID * 5 : GRID;
    const mv = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, -d], ArrowDown: [0, d] }[k];
    if (mv) { n.x += mv[0]; n.y += mv[1]; place(n); Store.change('notes'); return true; }
    return false;
  }

  function cycle(dir) {
    if (!board.notes.length) return;
    const order = board.notes.slice().sort((a, b) => (Math.round(a.y / 120) - Math.round(b.y / 120)) || a.x - b.x);
    const i = order.findIndex((m) => m.id === sel);
    const next = order[(i + dir + order.length) % order.length];
    center(next.id, false);
  }

  /* ── note operations ── */
  function freeSpot() {
    const W = vp.clientWidth, H = vp.clientHeight;
    let x = Math.round(((W / 2 - view.x) / view.z - 130) / GRID) * GRID;
    let y = Math.round(((H / 3 - view.y) / view.z - 40) / GRID) * GRID;
    while (board.notes.some((m) => Math.abs(m.x - x) < 16 && Math.abs(m.y - y) < 16)) { x += 24; y += 24; }
    return { x, y };
  }

  function addNote(at, focus, html = '<p><br></p>', extra = {}) {
    if (!board) return null;
    const p = at || freeSpot();
    const n = { id: uid(), x: Math.round(p.x / GRID) * GRID, y: Math.round(p.y / GRID) * GRID, w: 260, h: null, color: extra.color || (sel && Store.noteRef(sel) ? Store.noteRef(sel).note.color : 'straw'), z: ++maxZ, html, title: '', text: '', created: now(), updated: now() };
    Object.assign(n, Editor.derive(html));
    board.notes.push(n);
    Store.S.notes.set(n.id, { note: n, board });
    plane.append(build(n));
    updateEmpty();
    select(n.id);
    Store.change('notes');
    if (focus) {
      focusBody(n.id);
      requestAnimationFrame(() => { const el = els.get(n.id); if (el && !el.contains(document.activeElement)) focusBody(n.id); });
    }
    return n;
  }

  function remove(id, quiet) {
    const ref = Store.noteRef(id); if (!ref) return;
    const { note, board: b } = ref;
    const i = b.notes.indexOf(note);
    b.notes.splice(i, 1);
    Store.S.notes.delete(id);
    if (els.get(id)) { els.get(id).remove(); els.delete(id); }
    if (sel === id) sel = null;
    updateEmpty();
    Store.change('notes');
    if (quiet) return;
    const label = note.title ? `Deleted “${note.title.slice(0, 32)}”` : 'Deleted note';
    App.pushUndo(label, () => {
      b.notes.splice(Math.min(i, b.notes.length), 0, note);
      Store.S.notes.set(note.id, { note, board: b });
      if (board === b) { plane.append(build(note)); updateEmpty(); select(note.id); }
      Store.change('notes');
    });
  }

  function duplicate(n) {
    const c = addNote({ x: n.x + 24, y: n.y + 24 }, false, n.html, { color: n.color });
    if (c) { c.w = n.w; c.h = n.h; place(c); }
  }

  function setColor(n, c) {
    const el = els.get(n.id);
    if (el) { el.classList.remove('paper-' + n.color); el.classList.add('paper-' + c); }
    n.color = c;
    Store.change('notes');
  }

  /* tidy into rows, keeping reading order */
  function arrange() {
    if (!board || !board.notes.length) return;
    const gap = 24;
    const order = board.notes.slice().sort((a, b) => (Math.round(a.y / 160) - Math.round(b.y / 160)) || a.x - b.x);
    const x0 = Math.round(Math.min(...order.map((n) => n.x)) / GRID) * GRID;
    const y0 = Math.round(Math.min(...order.map((n) => n.y)) / GRID) * GRID;
    const width = Math.max(560, vp.clientWidth / view.z - 80);
    // masonry: columns of the widest note, each note goes to the shortest column
    const colW = Math.max(...order.map((n) => n.w));
    const cols = Math.max(1, Math.floor((width + gap) / (colW + gap)));
    const heights = new Array(cols).fill(y0);
    for (const n of order) {
      const el = els.get(n.id);
      let c = 0;
      for (let i = 1; i < cols; i++) if (heights[i] < heights[c] - 1) c = i;
      n.x = x0 + c * (colW + gap);
      n.y = heights[c];
      heights[c] += (el ? el.offsetHeight : 160) + gap;
    }
    plane.classList.add('arranging');
    for (const n of order) place(n);
    setTimeout(() => plane.classList.remove('arranging'), 420);
    Store.change('notes');
  }

  /* ── backlinks ── */
  const refreshFeet = debounce(() => {
    if (!board) return;
    const back = new Map();
    for (const [id, { note }] of Store.S.notes) {
      const re = /data-note="([^"]+)"/g; let m;
      const seen = new Set();
      while ((m = re.exec(note.html))) if (!seen.has(m[1])) { seen.add(m[1]); (back.get(m[1]) || back.set(m[1], []).get(m[1])).push(id); }
    }
    for (const [id, el] of els) {
      const list = back.get(id) || [];
      const foot = el.querySelector('.note-foot');
      const txt = list.length ? `${list.length} ${list.length === 1 ? 'note links' : 'notes link'} here` : '';
      if (foot.dataset.txt !== txt) { foot.dataset.txt = txt; foot.innerHTML = txt ? `<button class="backlinks" tabindex="-1">${esc(txt)}</button>` : ''; }
      foot._back = list;
    }
  }, 200);

  function backlinksMenu(n, foot) {
    const r = foot.getBoundingClientRect();
    Popup.open({
      x: r.left, y: r.bottom, title: 'Linked from',
      items: (foot._back || []).map((id) => { const ref = Store.noteRef(id); return ref && { id, label: ref.note.title || 'Untitled', hint: ref.board.name, icon: 'note' }; }).filter(Boolean),
      onPick: (it) => bus.emit('goto-note', it.id),
    });
  }

  /* ── drop files onto the board: one note per drop ── */
  async function onDrop(e) {
    vp.classList.remove('drop');
    const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
    if (!files.length || e.target.closest('.note')) return;
    e.preventDefault();
    const p = toBoard(e.clientX, e.clientY);
    let html = '';
    for (const f of files) {
      if (f.type.startsWith('image/')) {
        const res = await Store.saveImage(f, f.name);
        html += `<p>${esc(f.name)}</p><figure class="pic" contenteditable="false" data-src="${esc(res.path || res.dataUrl)}"></figure>`;
      } else {
        const path = await Store.importFile(f);
        if (path) html += `<p><span class="fref" contenteditable="false" data-path="${esc(path)}">${esc(f.name)}</span>&nbsp;</p>`;
        else toast('Open a vault folder to attach files', { kind: 'warn' });
      }
    }
    if (html) {
      const n = addNote({ x: p.x - 40, y: p.y - 20 }, false, html + '<p><br></p>');
      if (n && /figure/.test(html)) { n.w = 360; place(n); }
    }
  }

  return {
    init, mount, unmount, addNote, remove, arrange, fit, center, key, select, focusBody,
    zoom: () => view.z, zoomAt, current: () => board, selected: () => sel, COLORS,
    refreshChips: () => { for (const el of els.values()) Editor.refreshChips(el.querySelector('.note-body')); },
  };
})();

/* ── 08-secrets.js ── */
/* ── secrets: key/value pairs with plain and key:value tags ────────── */
const Secrets = (() => {
  let root, list, filterInp, countEl, drawer;
  let rows = [], cur = 0, editingId = null;
  const revealed = new Set();
  const MASK = '••••••••••••';

  const parseTag = (t) => { const i = t.indexOf(':'); return i > 0 ? { k: t.slice(0, i), v: t.slice(i + 1) } : { k: t, v: null }; };
  const chip = (t, on) => {
    const { k, v } = parseTag(t);
    return `<button class="chip${v != null ? ' kv' : ''}${on ? ' on' : ''}" data-tag="${esc(t)}" tabindex="-1">${v != null ? `<b>${esc(k)}</b><span>${esc(v)}</span>` : esc(k)}</button>`;
  };
  const tagsOf = (s) => s.split(/[\s,]+/).map((t) => t.trim().replace(/^#/, '')).filter(Boolean);

  function init(el) {
    root = el;
    filterInp = h('input', { class: 'field s-filter', placeholder: 'Filter by key or tag, e.g. env:prod aws -legacy', spellcheck: 'false', autocomplete: 'off' });
    countEl = h('span', { class: 's-count muted' });
    list = h('div', { class: 's-list', role: 'listbox', tabindex: '0' });
    drawer = h('aside', { class: 's-drawer', hidden: true });
    root.append(
      h('div', { class: 's-bar' },
        h('div', { class: 's-search', html: icon('search') }, filterInp),
        countEl,
        h('button', { class: 'btn', html: `${icon('plus')}New secret <kbd>N</kbd>`, onclick: () => edit(null) }),
        h('button', { class: 'btn ghost', text: 'Import .env', onclick: importEnv }),
        h('button', { class: 'btn ghost', text: 'Copy as .env', onclick: exportEnv })),
      h('div', { class: 's-head' }, h('span', { text: 'Key' }), h('span', { text: 'Value' }), h('span', { text: 'Tags' }), h('span')),
      list, drawer);

    filterInp.addEventListener('input', () => { cur = 0; render(); });
    filterInp.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
      else if (e.key === 'Enter' && modKey(e)) { e.preventDefault(); if (rows[cur]) edit(rows[cur]); }
      else if (e.key === 'Enter') { e.preventDefault(); if (rows[cur]) copy(rows[cur]); }
      else if (e.key === 'Escape') { e.preventDefault(); if (filterInp.value) { filterInp.value = ''; render(); } else list.focus(); }
    });
    list.addEventListener('click', (e) => {
      const tagB = e.target.closest('.chip');
      if (tagB) { toggleFilter(tagB.dataset.tag); return; }
      const row = e.target.closest('.srow'); if (!row) return;
      const x = Store.secret(row.dataset.id); if (!x) return;
      cur = rows.indexOf(x);
      const a = e.target.closest('[data-a]');
      if (a && a.dataset.a === 'copy') copy(x);
      else if (a && a.dataset.a === 'reveal') reveal(x);
      else if (a && a.dataset.a === 'key') copyKey(x);
      else { mark(); }
    });
    list.addEventListener('dblclick', (e) => { const row = e.target.closest('.srow'); if (row && !e.target.closest('button')) edit(Store.secret(row.dataset.id)); });
  }

  /* ── filtering ── */
  function matches(x, toks) {
    for (const t of toks) {
      let neg = false, q = t;
      if (q[0] === '-' && q.length > 1) { neg = true; q = q.slice(1); }
      let hit;
      const ci = q.indexOf(':');
      if (ci > 0) {
        const k = q.slice(0, ci), v = q.slice(ci + 1);
        hit = x.tags.some((tg) => { const p = parseTag(tg); return p.v != null && p.k.toLowerCase() === k && p.v.toLowerCase().startsWith(v); });
      } else {
        hit = x.key.toLowerCase().includes(q) || x.desc.toLowerCase().includes(q) ||
          x.tags.some((tg) => { const p = parseTag(tg); return p.k.toLowerCase().startsWith(q) || (p.v != null && p.v.toLowerCase().startsWith(q)); });
      }
      if (hit === neg) return false;
    }
    return true;
  }
  function toggleFilter(tag) {
    const toks = filterInp.value.split(/\s+/).filter(Boolean);
    const i = toks.findIndex((t) => t.toLowerCase() === tag.toLowerCase());
    if (i >= 0) toks.splice(i, 1); else toks.push(tag);
    filterInp.value = toks.join(' ') + (toks.length ? ' ' : '');
    cur = 0; render();
  }
  function setFilter(q) { filterInp.value = q; cur = 0; render(); }

  /* ── rendering ── */
  function render() {
    if (!root || !Store.S.data) return;
    const toks = filterInp.value.toLowerCase().split(/\s+/).filter(Boolean);
    const active = new Set(toks);
    const all = Store.S.data.secrets;
    rows = all.filter((x) => matches(x, toks)).sort((a, b) => a.key.localeCompare(b.key) || (b.updated || 0) - (a.updated || 0));
    cur = clamp(cur, 0, Math.max(0, rows.length - 1));
    countEl.textContent = toks.length ? `${rows.length} of ${all.length}` : `${all.length} ${all.length === 1 ? 'secret' : 'secrets'}`;
    if (!all.length) {
      list.innerHTML = `<div class="s-empty"><p>No secrets yet.</p><p class="muted">Press <kbd>N</kbd> to add one, or paste a <code>.env</code> file with Import .env. Tags like <code>env:prod</code> group them.</p></div>`;
      return;
    }
    if (!rows.length) { list.innerHTML = `<div class="s-empty"><p>Nothing matches “${esc(filterInp.value.trim())}”.</p><p class="muted">Press <kbd>Esc</kbd> to clear the filter.</p></div>`; return; }
    let out = '';
    rows.forEach((x, i) => {
      const show = revealed.has(x.id);
      const v = show ? esc(x.value.length > 400 ? x.value.slice(0, 400) + '…' : x.value) : MASK;
      out += `<div class="srow${i === cur ? ' on' : ''}" data-id="${esc(x.id)}" role="option">` +
        `<div class="s-key"><button class="s-keyname" data-a="key" tabindex="-1" title="Copy key">${esc(x.key)}</button>${x.desc ? `<div class="s-desc">${esc(x.desc)}</div>` : ''}</div>` +
        `<div class="s-val${show ? ' shown' : ''}">${v}</div>` +
        `<div class="s-tags">${x.tags.map((t) => chip(t, active.has(t.toLowerCase()))).join('')}</div>` +
        `<div class="s-act"><button data-a="reveal" title="Reveal (Space)" tabindex="-1">${icon(show ? 'eyeoff' : 'eye')}</button>` +
        `<button data-a="copy" title="Copy value (C)" tabindex="-1">${icon('copy')}</button></div></div>`;
    });
    list.innerHTML = out;
    scrollCur();
  }
  function mark() {
    $$('.srow.on', list).forEach((r) => r.classList.remove('on'));
    const x = rows[cur]; if (!x) return;
    const el = list.querySelector(`.srow[data-id="${CSS.escape(x.id)}"]`);
    if (el) el.classList.add('on');
    scrollCur();
  }
  function scrollCur() { const el = list.querySelector('.srow.on'); if (el) el.scrollIntoView({ block: 'nearest' }); }
  function move(d) { if (!rows.length) return; cur = clamp(cur + d, 0, rows.length - 1); mark(); }

  /* ── actions ── */
  async function copy(x) {
    if (await copyText(x.value)) { toast(`Copied ${x.key}`); flash(x); }
  }
  async function copyKey(x) { if (await copyText(x.key)) toast(`Copied the name ${x.key}`); }
  function flash(x) {
    const el = list.querySelector(`.srow[data-id="${CSS.escape(x.id)}"]`);
    if (el) { el.classList.remove('copied'); void el.offsetWidth; el.classList.add('copied'); }
  }
  function reveal(x) {
    if (revealed.has(x.id)) revealed.delete(x.id); else revealed.add(x.id);
    render();
  }
  function remove(x) {
    const all = Store.S.data.secrets;
    const i = all.indexOf(x); if (i < 0) return;
    all.splice(i, 1);
    Store.change('secrets');
    render();
    App.pushUndo(`Deleted ${x.key}`, () => { all.splice(Math.min(i, all.length), 0, x); Store.change('secrets'); render(); });
  }

  function generate(len = 32) {
    const a = new Uint8Array(len);
    crypto.getRandomValues(a);
    const abc = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
    return Array.from(a, (b) => abc[b & 63]).join('');
  }

  /* ── edit drawer ── */
  function edit(x) {
    const isNew = !x;
    editingId = x ? x.id : null;
    const keyI = h('input', { class: 'field mono', value: x ? x.key : '', placeholder: 'STRIPE_SECRET_KEY', spellcheck: 'false', autocomplete: 'off' });
    const valI = h('textarea', { class: 'field mono masked', rows: '3', placeholder: 'value', spellcheck: 'false', autocomplete: 'off', 'data-shy': '' });
    valI.value = x ? x.value : '';
    const tagI = h('input', { class: 'field mono', value: x ? x.tags.join(' ') : (filterInp.value.split(/\s+/).filter((t) => t && t[0] !== '-' && /:|^[a-z]/i.test(t) && Store.S.data.secrets.some((s) => s.tags.includes(t))).join(' ')), placeholder: 'env:prod aws billing', spellcheck: 'false', autocomplete: 'off' });
    const descI = h('input', { class: 'field', value: x ? x.desc : '', placeholder: 'Where it is used, who owns it', spellcheck: 'false' });
    const preview = h('div', { class: 'tag-preview' });
    const sugg = h('div', { class: 'tag-sugg' });
    const eyeB = h('button', { class: 'icon-btn', type: 'button', title: 'Show value', html: icon('eye') });
    const genB = h('button', { class: 'icon-btn', type: 'button', title: 'Generate a random value', html: icon('dice') });
    eyeB.onclick = () => { valI.classList.toggle('masked'); eyeB.innerHTML = icon(valI.classList.contains('masked') ? 'eye' : 'eyeoff'); };
    genB.onclick = () => { valI.value = generate(); valI.classList.remove('masked'); eyeB.innerHTML = icon('eyeoff'); };
    const upd = () => {
      preview.innerHTML = tagsOf(tagI.value).map((t) => chip(t)).join('');
      const have = new Set(tagsOf(tagI.value));
      const freq = new Map();
      for (const s of Store.S.data.secrets) for (const t of s.tags) if (!have.has(t)) freq.set(t, (freq.get(t) || 0) + 1);
      sugg.innerHTML = [...freq].sort((a, b) => b[1] - a[1]).slice(0, 14).map(([t]) => chip(t)).join('');
    };
    sugg.addEventListener('mousedown', (e) => { const c = e.target.closest('.chip'); if (!c) return; e.preventDefault(); tagI.value = (tagI.value.trim() + ' ' + c.dataset.tag).trim() + ' '; upd(); tagI.focus(); });
    tagI.addEventListener('input', upd);
    upd();

    const save = () => {
      const key = keyI.value.trim();
      if (!key) { keyI.focus(); keyI.classList.add('bad'); return; }
      const tags = [...new Set(tagsOf(tagI.value))];
      const t = now();
      if (isNew) {
        const nx = { id: uid(), key, value: valI.value, tags, desc: descI.value.trim(), created: t, updated: t };
        Store.S.data.secrets.push(nx);
        toast(`Added ${key}`);
      } else {
        Object.assign(x, { key, value: valI.value, tags, desc: descI.value.trim(), updated: t });
        toast(`Saved ${key}`);
      }
      Store.change('secrets');
      close();
      render();
      const target = isNew ? Store.S.data.secrets[Store.S.data.secrets.length - 1] : x;
      cur = Math.max(0, rows.indexOf(target)); mark();
      list.focus();
    };
    const close = () => { drawer.hidden = true; drawer.replaceChildren(); editingId = null; root.classList.remove('drawer-open'); };

    drawer.replaceChildren(...[
      h('div', { class: 'd-head' }, h('h3', { text: isNew ? 'New secret' : x.key }), h('button', { class: 'icon-btn', title: 'Close (Esc)', html: icon('x'), onclick: () => { close(); list.focus(); } })),
      h('label', null, h('span', { text: 'Key' }), keyI),
      h('label', null, h('span', { text: 'Value' }), h('div', { class: 'val-wrap' }, valI, h('div', { class: 'val-tools' }, eyeB, genB))),
      h('label', null, h('span', { html: 'Tags <em>space separated; <code>key:value</code> for grouped tags</em>' }), tagI, preview),
      sugg,
      h('label', null, h('span', { text: 'Note' }), descI),
      x ? h('p', { class: 'muted small', text: `Created ${relTime(x.created)}. Updated ${relTime(x.updated)}.` }) : null,
      h('div', { class: 'd-actions' },
        x ? h('button', { class: 'btn danger ghost', text: 'Delete', onclick: () => { close(); remove(x); } }) : h('span'),
        h('span', { class: 'grow' }),
        h('button', { class: 'btn ghost', text: 'Cancel', onclick: () => { close(); list.focus(); } }),
        h('button', { class: 'btn primary', html: `${isNew ? 'Add secret' : 'Save'} <kbd>${MOD}↵</kbd>`, onclick: save }))].filter(Boolean));
    drawer.onkeydown = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); list.focus(); }
      if (e.key === 'Enter' && (modKey(e) || (e.target.tagName === 'INPUT'))) { e.preventDefault(); save(); }
    };
    drawer.hidden = false;
    root.classList.add('drawer-open');
    (isNew ? keyI : valI).focus();
  }

  /* ── .env import / export ── */
  function parseEnv(text) {
    const out = [];
    const lines = text.replace(/\r\n?/g, '\n').split('\n');
    for (let i = 0; i < lines.length; i++) {
      let l = lines[i].trim();
      if (!l || l[0] === '#') continue;
      l = l.replace(/^export\s+/, '');
      const m = /^([A-Za-z_][\w.-]*)\s*[=:]\s*(.*)$/.exec(l);
      if (!m) continue;
      let v = m[2];
      if (v[0] === '"') {
        let s = v.slice(1);
        while (!/(^|[^\\])"\s*(#.*)?$/.test(s) && i + 1 < lines.length) s += '\n' + lines[++i];
        v = s.replace(/"\s*(#.*)?$/, '').replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\\\/g, '\\');
      } else if (v[0] === "'") v = v.slice(1).replace(/'\s*(#.*)?$/, '');
      else v = v.replace(/\s+#.*$/, '').trim();
      out.push({ key: m[1], value: v });
    }
    return out;
  }
  function importEnv() {
    const ta = h('textarea', { class: 'field mono', rows: '10', placeholder: 'DATABASE_URL=postgres://…\nexport API_KEY="…"', spellcheck: 'false', 'data-shy': '' });
    const tags = h('input', { class: 'field mono', placeholder: 'Tags for all of them, e.g. env:staging api', spellcheck: 'false' });
    const info = h('p', { class: 'muted small', text: 'Paste the contents of a .env file. Existing keys with the same tags are updated.' });
    ta.addEventListener('input', () => { const n = parseEnv(ta.value).length; info.textContent = n ? `${n} ${n === 1 ? 'secret' : 'secrets'} found.` : 'Paste the contents of a .env file.'; });
    Modal.open({
      title: 'Import .env', wide: true,
      body: h('div', { class: 'stack' }, ta, tags, info),
      actions: [{ label: 'Cancel', value: null }, { label: 'Import', primary: true, run: () => {
        const items = parseEnv(ta.value);
        if (!items.length) { info.textContent = 'No KEY=value lines found.'; return false; }
        const tg = [...new Set(tagsOf(tags.value))];
        const sig = (t) => t.slice().sort().join(' ');
        let added = 0, updated = 0;
        for (const it of items) {
          const ex = Store.S.data.secrets.find((s) => s.key === it.key && sig(s.tags) === sig(tg));
          if (ex) { if (ex.value !== it.value) { ex.value = it.value; ex.updated = now(); updated++; } }
          else { Store.S.data.secrets.push({ id: uid(), key: it.key, value: it.value, tags: tg.slice(), desc: '', created: now(), updated: now() }); added++; }
        }
        Store.change('secrets'); render();
        toast(`Imported: ${added} added, ${updated} updated`);
        return true;
      } }],
    });
  }
  async function exportEnv() {
    if (!rows.length) { toast('Nothing to copy'); return; }
    const q = (v) => (/^[\w@%+=:,./-]*$/.test(v) ? v : '"' + v.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"');
    const text = rows.map((x) => `${x.key}=${q(x.value)}`).join('\n') + '\n';
    if (await copyText(text)) toast(`Copied ${rows.length} ${rows.length === 1 ? 'line' : 'lines'} as .env`);
  }

  /* ── sidebar data ── */
  function tagStats() {
    const m = new Map();
    for (const s of Store.S.data.secrets) for (const t of s.tags) {
      const { k, v } = parseTag(t);
      const e = m.get(k) || m.set(k, { n: 0, vals: new Map() }).get(k);
      e.n++;
      if (v != null) e.vals.set(v, (e.vals.get(v) || 0) + 1);
    }
    return [...m].sort((a, b) => a[0].localeCompare(b[0]));
  }

  /* ── keyboard (view focused, not typing) ── */
  function key(e) {
    if (!drawer.hidden) return false;
    const x = rows[cur];
    const k = e.key;
    if (k === 'j' || k === 'ArrowDown') { move(1); return true; }
    if (k === 'k' || k === 'ArrowUp') { move(-1); return true; }
    if (k === 'g') { cur = 0; mark(); return true; }
    if (k === 'G') { cur = rows.length - 1; mark(); return true; }
    if (k === '/') { filterInp.focus(); filterInp.select(); return true; }
    if (k === 'n' || k === 'N') { edit(null); return true; }
    if (k === 'Escape' && filterInp.value) { setFilter(''); return true; }
    if (!x) return false;
    if (k === 'Enter' || k === 'e') { edit(x); return true; }
    if (k === 'c' || k === 'y') { copy(x); return true; }
    if (k === 'C' || k === 'Y') { copyKey(x); return true; }
    if (k === ' ') { reveal(x); return true; }
    if (k === 'Delete' || k === 'Backspace') { remove(x); return true; }
    return false;
  }

  function focus() { if (drawer.hidden) list.focus({ preventScroll: true }); }
  function select(id) { const x = Store.secret(id); if (!x) return; if (!matches(x, filterInp.value.toLowerCase().split(/\s+/).filter(Boolean))) setFilter(''); cur = rows.indexOf(x); mark(); flash(x); }

  return { init, render, key, focus, edit, select, setFilter, importEnv, exportEnv, tagStats, parseEnv, closeDrawer: () => { drawer.hidden = true; root && root.classList.remove('drawer-open'); } };
})();

/* ── 09-palette.js ── */
/* ── palette: search everything, run commands ─────────────────────
   plain  notes, boards, secrets (names and tags, never values)
   >      commands      @  notes only      $  secrets only      #  boards only */
const Palette = (() => {
  let el, inp, list, foot, items = [], idx = 0, built = -1, idxNotes = [], idxBoards = [], idxSecrets = [];

  function build() {
    if (built === Store.S.rev) return;
    built = Store.S.rev;
    idxNotes = []; idxBoards = []; idxSecrets = [];
    for (const b of Store.S.data.boards) {
      idxBoards.push({ type: 'board', id: b.id, title: b.name, t: b.name.toLowerCase(), sub: `${b.notes.length} ${b.notes.length === 1 ? 'note' : 'notes'}` });
      for (const n of b.notes) {
        const title = n.title || 'Untitled';
        idxNotes.push({ type: 'note', id: n.id, title, t: title.toLowerCase(), body: (n.text || '').toLowerCase(), raw: n.text || '', sub: b.name, upd: n.updated || 0 });
      }
    }
    for (const x of Store.S.data.secrets) {
      const tags = x.tags.join(' ');
      idxSecrets.push({ type: 'secret', id: x.id, title: x.key, t: x.key.toLowerCase(), body: (tags + ' ' + x.desc).toLowerCase(), sub: tags || x.desc });
    }
  }

  function snippet(raw, body, term) {
    const i = body.indexOf(term);
    if (i < 0) return '';
    const s = Math.max(0, i - 30), e = Math.min(raw.length, i + term.length + 50);
    const pre = (s > 0 ? '…' : '') + raw.slice(s, i), hit = raw.slice(i, i + term.length), post = raw.slice(i + term.length, e) + (e < raw.length ? '…' : '');
    return esc(pre.replace(/\n/g, ' ')) + '<mark>' + esc(hit) + '</mark>' + esc(post.replace(/\n/g, ' '));
  }

  function score(it, terms) {
    let total = 0, pos = [], snip = '';
    for (const term of terms) {
      const m = fuzzy(term, it.t);
      if (m && m.s > 0) { total += m.s; pos = pos.concat(m.p); continue; }
      if (it.body) {
        const j = it.body.indexOf(term);
        if (j >= 0) { total += 30 - Math.min(20, j / 50); if (!snip && it.raw) snip = snippet(it.raw, it.body, term); continue; }
      }
      if (m) { total += m.s; pos = pos.concat(m.p); continue; }
      return null;
    }
    return { s: total, p: pos, snip };
  }

  function search(q) {
    build();
    let mode = '';
    if (/^[>@$#]/.test(q)) { mode = q[0]; q = q.slice(1); }
    const terms = q.toLowerCase().trim().split(/\s+/).filter(Boolean);
    if (mode === '>') {
      const cmds = App.commands().filter((c) => !c.when || c.when());
      if (!terms.length) return cmds.map((c) => ({ ...c, type: 'cmd' }));
      return cmds.map((c) => { const m = fuzzy(terms.join(' '), c.title.toLowerCase()); return m && { ...c, type: 'cmd', s: m.s, p: m.p }; }).filter(Boolean).sort((a, b) => b.s - a.s);
    }
    const pools = mode === '@' ? [idxNotes] : mode === '$' ? [idxSecrets] : mode === '#' ? [idxBoards] : [idxNotes, idxBoards, idxSecrets];
    if (!terms.length) {
      // recent notes first, then boards
      const recent = mode === '' || mode === '@' ? idxNotes.slice().sort((a, b) => b.upd - a.upd).slice(0, mode ? 60 : 8) : [];
      return recent.concat(mode === '' || mode === '#' ? idxBoards : [], mode === '$' ? idxSecrets.slice(0, 60) : []);
    }
    const out = [];
    for (const pool of pools) for (const it of pool) {
      const r = score(it, terms);
      if (r) out.push({ ...it, s: r.s + (it.type === 'board' ? 5 : 0), p: r.p, snip: r.snip });
    }
    out.sort((a, b) => b.s - a.s || (b.upd || 0) - (a.upd || 0));
    return out.slice(0, 80);
  }

  const TYPE_ICON = { note: 'note', board: 'board', secret: 'key', cmd: 'cmd' };

  function render() {
    if (!items.length) {
      list.innerHTML = `<div class="pal-empty">${inp.value.startsWith('>') ? 'No command by that name.' : 'Nothing found. Try fewer letters, or <kbd>&gt;</kbd> for commands.'}</div>`;
      Bird.mood('rest');
      return;
    }
    list.innerHTML = items.map((it, i) =>
      `<div class="pal-item${i === idx ? ' on' : ''}" data-i="${i}">${icon(TYPE_ICON[it.type] || 'cmd')}` +
      `<div class="pal-main"><div class="pal-title">${markPositions(it.title, it.p)}</div>${it.snip ? `<div class="pal-snip">${it.snip}</div>` : ''}</div>` +
      `<span class="pal-sub">${it.type === 'cmd' ? (it.key ? `<kbd>${esc(it.key)}</kbd>` : '') : esc(it.sub || '')}${it.type === 'secret' && i === idx ? ' <kbd>↵ copy</kbd>' : ''}</span></div>`).join('');
    const on = list.children[idx]; if (on) on.scrollIntoView({ block: 'nearest' });
  }

  function update() {
    items = search(inp.value);
    idx = 0;
    render();
  }

  function show(prefix = '') {
    if (!Store.S.data) return;
    if (!el) {
      inp = h('input', { class: 'pal-input', placeholder: 'Search notes, boards, secrets.  > commands', spellcheck: 'false', autocomplete: 'off' });
      list = h('div', { class: 'pal-list' });
      foot = h('div', { class: 'pal-foot', html: `<span><kbd>↑↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>&gt;</kbd> commands</span><span><kbd>@</kbd> notes</span><span><kbd>$</kbd> secrets</span><span><kbd>#</kbd> boards</span>` });
      el = h('div', { class: 'scrim pal-scrim' }, h('div', { class: 'pal', role: 'dialog', 'aria-label': 'Search' }, h('div', { class: 'pal-top', html: icon('search') }, inp), list, foot));
      el.addEventListener('mousedown', (e) => { if (e.target === el) hide(); });
      list.addEventListener('mousedown', (e) => { const it = e.target.closest('.pal-item'); if (it) { e.preventDefault(); idx = +it.dataset.i; run(items[idx], e); } });
      list.addEventListener('mousemove', (e) => { const it = e.target.closest('.pal-item'); if (it && +it.dataset.i !== idx) { idx = +it.dataset.i; render(); } });
      inp.addEventListener('input', update);
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || (e.ctrlKey && e.key === 'n')) { e.preventDefault(); idx = Math.min(items.length - 1, idx + 1); render(); }
        else if (e.key === 'ArrowUp' || (e.ctrlKey && e.key === 'p')) { e.preventDefault(); idx = Math.max(0, idx - 1); render(); }
        else if (e.key === 'Enter') { e.preventDefault(); if (items[idx]) run(items[idx], e); }
        else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); hide(); }
        else if (e.key === 'Tab') { e.preventDefault(); }
      });
    }
    document.body.append(el);
    inp.value = prefix;
    update();
    inp.focus();
    Bird.mood('wide');
    setTimeout(() => Bird.mood('rest'), 600);
  }

  function hide() { if (el && el.isConnected) el.remove(); }

  function run(it, e) {
    hide();
    if (it.type === 'cmd') return it.run();
    if (it.type === 'note') return App.gotoNote(it.id, true);
    if (it.type === 'board') return App.openTab('b:' + it.id);
    if (it.type === 'secret') {
      const x = Store.secret(it.id);
      if (modKey(e) || !x) { App.openTab('secrets'); Secrets.select(it.id); return; }
      copyText(x.value).then(() => toast(`Copied ${x.key}`));
    }
  }

  return { show, hide, isOpen: () => !!(el && el.isConnected), search };
})();

/* ── 10-app.js ── */
/* ── app shell: welcome, tabs, explorer, status bar, keys, commands ── */
const App = (() => {
  let shell, welcome, tabsEl, side, boardVp, secretsEl, viewEmpty, statusEl;
  const undoStack = [];
  let lastActivity = now();

  /* ── theme ── */
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    ls.set('theme', t);
  }
  setTheme(ls.get('theme', matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night'));

  /* ── welcome / unlock ───────────────────────────────────────── */
  function showWelcome(mode = 'start', env = null) {
    shell.hidden = true;
    welcome.hidden = false;
    welcome.replaceChildren();
    const bird = h('div', { class: 'w-bird' }, Bird.make('big'));
    const card = h('div', { class: 'w-card' });
    welcome.append(h('div', { class: 'w-inner' }, bird, card));

    if (mode === 'locked') {
      const inp = h('input', { class: 'field w-pass', type: 'password', placeholder: 'Passphrase', 'data-shy': '', autocomplete: 'current-password' });
      const err = h('p', { class: 'w-err', role: 'alert' });
      const go = async () => {
        if (!inp.value) return;
        btn.disabled = true; btn.textContent = 'Unlocking…';
        try {
          await Store.unlock(inp.value, env);
          enter();
        } catch {
          err.textContent = 'That passphrase does not open this vault.';
          card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
          btn.disabled = false; btn.textContent = 'Unlock'; inp.select();
        }
      };
      const btn = h('button', { class: 'btn primary', text: 'Unlock', onclick: go });
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
      card.append(
        h('p', { class: 'w-lead', html: `<b>${esc(Store.S.vault.file)}</b> in ${esc(Store.S.vault.name)} is locked.` }),
        h('div', { class: 'w-row' }, inp, btn), err,
        h('button', { class: 'btn ghost small', text: 'Choose another vault', onclick: () => { Store.close(); showWelcome(); } }));
      setTimeout(() => inp.focus(), 50);
      return;
    }

    const actions = h('div', { class: 'w-actions' });
    card.append(h('p', { class: 'w-lead', text: 'Sticky notes and secrets, kept in one file in a folder you choose.' }), actions);
    if (Store.canPickDir()) {
      actions.append(h('button', { class: 'btn primary big', html: `${icon('folder')} Open a folder <kbd>↵</kbd>`, onclick: pickFolder }));
      const ul = h('div', { class: 'w-recents' });
      actions.append(ul);
      Promise.race([Store.recents(), new Promise((r) => setTimeout(() => r([]), 800))]).then((rec) => {
        if (!rec.length || !ul.isConnected) return;
        ul.append(h('span', { class: 'muted small', text: 'Recent' }));
        rec.forEach((r, i) => ul.append(h('button', { class: 'btn ghost recent', html: `${icon('folder')}<span>${esc(r.name)}</span><kbd>${i + 1}</kbd>`, onclick: () => reopen(r) })));
      });
    } else {
      actions.append(h('p', { class: 'muted small', text: 'This browser cannot write to folders on disk. Use Chrome, Edge, Arc or Brave for that. Here, your vault lives in this tab; download it to keep it.' }));
    }
    const alt = h('div', { class: 'w-alt' });
    if (Store.canOPFS()) alt.append(h('button', { class: 'btn ghost', text: 'Use browser storage', title: 'Saved inside this browser profile, not in a folder', onclick: useOPFS }));
    alt.append(h('button', { class: 'btn ghost', text: 'Import a .frogmouth file', onclick: importFile }));
    alt.append(h('button', { class: 'btn ghost', text: 'Try it without saving', onclick: () => { Store.openMemory(); enter(); } }));
    actions.append(alt);
    card.append(h('p', { class: 'w-fine', html: `This page makes no network requests. The vault is readable JSON unless you set a passphrase (AES-256).` }));
  }

  async function pickFolder() {
    try {
      const dir = await showDirectoryPicker({ mode: 'readwrite', id: 'frogmouth' });
      await openVault(dir, 'dir');
    } catch (err) { if (err && err.name !== 'AbortError') toast(err.message || 'Could not open folder', { kind: 'warn' }); }
  }
  async function reopen(r) {
    try {
      let p = await r.handle.queryPermission({ mode: 'readwrite' });
      if (p !== 'granted') p = await r.handle.requestPermission({ mode: 'readwrite' });
      if (p !== 'granted') { toast('Permission to the folder was not granted', { kind: 'warn' }); return; }
      await openVault(r.handle, 'dir');
    } catch (err) {
      toast(`Could not reopen ${r.name}. It may have moved.`, { kind: 'warn' });
      await Store.forgetRecent(r.handle);
      showWelcome();
    }
  }
  async function useOPFS() {
    try { await openVault(await navigator.storage.getDirectory(), 'opfs'); }
    catch (err) { toast('Browser storage is unavailable here', { kind: 'warn' }); }
  }
  function importFile() {
    const inp = h('input', { type: 'file', accept: '.frogmouth,application/json', style: { display: 'none' } });
    inp.onchange = async () => {
      const f = inp.files[0]; inp.remove(); if (!f) return;
      try {
        const j = JSON.parse(await f.text());
        if (j.encrypted) {
          Store.S.vault = { kind: 'memory', name: f.name, file: f.name };
          const pass = await Modal.prompt('Passphrase for ' + f.name, '', { type: 'password', shy: true, label: 'Unlock' });
          if (!pass) return;
          await Store.unlock(pass, j);
          Store.S.vault = { kind: 'memory', name: f.name, file: f.name };
          Store.setStatus('memory', 'Kept in memory');
          enter();
        } else { Store.openMemory(j.data || j, f.name); enter(); }
      } catch { toast('That file could not be read as a vault', { kind: 'warn' }); }
    };
    document.body.append(inp); inp.click();
  }

  async function openVault(dir, kind) {
    try {
      const res = await Store.openDir(dir, kind);
      if (res.locked) return showWelcome('locked', res.env);
      enter();
      if (res.fresh) toast(`Created ${Store.FILE} in ${Store.S.vault.name}`);
    } catch (err) {
      console.error(err);
      Modal.open({ title: 'Could not open the vault', body: h('p', { text: err.message || String(err) }), actions: [{ label: 'OK', primary: true }] });
    }
  }

  /* ── entering the app ─────────────────────────────────────── */
  function enter() {
    welcome.hidden = true;

      return;

    if (isTypingTarget(e.target)) return;

      h('div', { class: 'main' }, side, h('section', { class: 'view' }, boardVp, secretsEl, viewEmpty)),
      statusEl);
    app.append(welcome, shell, h('div', { id: 'toasts', 'aria-live': 'polite' }));
    Board.init(boardVp);
    Secrets.init(secretsEl);
    statusEl.addEventListener('click', onStatusClick);
    addEventListener('keydown', onKey);
    bus.on('status', renderStatus);
    bus.on('zoom', () => { const z = statusEl.querySelector('[data-act="zoom"]'); if (z) z.textContent = Math.round(Board.zoom() * 100) + '%'; });
    bus.on('change', (what) => {
      if (what === 'secrets' || what === 'boards' || what === 'notes') renderSide();
      if (what === 'secrets') Board.refreshChips();
      renderStatus();
    });
    bus.on('goto-note', gotoNote);
    addEventListener('beforeunload', (e) => {
      if (!Store.S.data || !Store.S.dirty) return;
      if (Store.S.vault.kind !== 'memory') Store.saveNow.flush();
      e.preventDefault(); e.returnValue = '';
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden && Store.S.dirty && Store.S.vault && Store.S.vault.kind !== 'memory') Store.saveNow.flush(); });
    showWelcome();
  }

  return { boot, openTab, gotoNote, pushUndo, commands, enter, showWelcome, openVault };
})();

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', App.boot);
else App.boot();

})();
</script>
</body>
</html>
