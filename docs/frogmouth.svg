<svg xmlns="http://www.w3.org/2000/svg" class="fm" viewBox="-340 -156 692 642" width="692" height="642" role="img" aria-label="frogmouth"><title>frogmouth</title><style>
.fm text{font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:800;fill:#dce6e3;stroke:#121a1d;stroke-width:6px;stroke-linejoin:round;paint-order:stroke;letter-spacing:-.01em}
.fm-iris{fill:#e19a26}.fm-iris-in{fill:#f5c55a;opacity:.75}.fm-ring{fill:none;stroke:#2e2105;stroke-width:2.5}
.fm-pup{fill:#0b0d0c}.fm-glint{fill:#fff6df}.fm-lid{fill:#737c7a}.fm-lid-edge{stroke:#2a302f;stroke-width:2.5;stroke-linecap:round}
.fm-skull{fill:#687170}.fm-body{fill:#59615f}.fm-wing{fill:#687170;opacity:.55}.fm-beak-top{fill:#a9b2ae;opacity:.45}
.fm-streak{fill:none;stroke:#3b4241;stroke-width:3.5;stroke-linecap:round}
.fm-brow path,.fm-bristle{fill:none;stroke:#a9b2ae;stroke-width:3.5;stroke-linecap:round}.fm-bristle{stroke-width:2.5}
.fm-beak{fill:#a19c87}.fm-gape{fill:none;stroke:#3b4241;stroke-width:3;stroke-linecap:round}
.fm-branch{fill:none;stroke:#33403f;stroke-width:18;stroke-linecap:round}.fm-twig{fill:none;stroke:#33403f;stroke-width:7;stroke-linecap:round}
.fm-feet{fill:none;stroke:#a19c87;stroke-width:4;stroke-linecap:round}
/* no JavaScript on GitHub, so the bird blinks, glances around and squints on a loop */
.fm-lidg{transform:translateY(-25.27px);animation:lids 9s infinite}
.fm-pupil{animation:look 9s infinite cubic-bezier(.4,0,.2,1)}
.fm-head{transform-box:view-box;transform-origin:0 40px;animation:tilt 9s infinite cubic-bezier(.4,0,.2,1)}
@keyframes lids{0%,18%{transform:translateY(-25.27px)}19.5%{transform:translateY(30.92px)}21%,58%{transform:translateY(-25.27px)}64%,78%{transform:translateY(2.17px)}82%,89%{transform:translateY(-25.27px)}90%{transform:translateY(30.92px)}91.5%,100%{transform:translateY(-25.27px)}}
@keyframes look{0%,8%{transform:translate(0,0)}14%,30%{transform:translate(-9px,2px)}36%,52%{transform:translate(9px,-3px)}58%,82%{transform:translate(0,4px)}88%,100%{transform:translate(0,0)}}
@keyframes tilt{0%,8%{transform:rotate(0)}14%,30%{transform:rotate(-3deg)}36%,52%{transform:rotate(3deg)}58%,100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.fm-lidg,.fm-pupil,.fm-head{animation:none}}
